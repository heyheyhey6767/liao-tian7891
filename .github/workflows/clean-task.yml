name: clean task
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  call-clean:
    runs-on: ubuntu-latest
    steps:
      - name: 调用清理接口
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" -X POST "${{ secrets.FUNC_URL }}" \
            -H "Authorization: Bearer ${{ secrets.FUNC_AUTH }}")
          echo "HTTP $code"
          cat /tmp/out.txt
          if [ "$code" != "200" ]; then exit 1; fi
