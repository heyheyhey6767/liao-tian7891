<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小鸟贴吧 · 社区留言板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563EB'/%3E%3Ctext x='32' y='44' font-size='36' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E鸟%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#FAFBFC;
    --border:#E6E8EC; --border-strong:#D6DAE1;
    --primary:#2563EB; --primary-strong:#1D4ED8; --primary-weak:#EAF1FE;
    --accent:#F59E0B; --accent-weak:#FEF3E2;
    --text:#1B1F26; --text-2:#69707A; --text-3:#9AA1AB;
    --danger:#DC2626; --danger-weak:#FEF2F2;
    --ok:#16A34A; --ok-weak:#EAF7EF;
    --radius:12px; --radius-s:8px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --font:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font); background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; min-height:100dvh; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,textarea{font-family:inherit; color:inherit;}
  a{color:var(--primary);}

  /* ===== 顶部栏（fixed 固定，滑动不再消失） ===== */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border); padding:10px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    box-shadow:var(--shadow);
  }
  .brand{display:flex; align-items:center; gap:9px; font-size:17px; font-weight:700; letter-spacing:.5px;}
  .brand-logo{width:28px; height:28px; border-radius:8px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; flex:none;}
  .brand-logo svg{width:16px; height:16px;}
  .brand .tag{font-size:11px; font-weight:500; color:var(--text-3); background:var(--surface-2); border:1px solid var(--border); padding:2px 8px; border-radius:999px; letter-spacing:0;}
  .top-actions{display:flex; align-items:center; gap:10px; position:relative;}
  .conn-state{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-2);}
  .conn-state .dot{width:7px; height:7px; border-radius:50%; background:var(--text-3); flex:none;}
  .conn-state.on .dot{background:var(--ok);}
  .conn-state.off .dot{background:var(--danger);}
  .icon-btn{
    width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    color:var(--text-2); border:1px solid var(--border); background:var(--surface);
    transition:background .15s, color .15s;
  }
  .icon-btn:hover{background:var(--surface-2); color:var(--text);}
  .icon-btn svg{width:16px; height:16px;}
  .icon-btn.key-on{color:var(--ok); border-color:var(--ok); background:var(--ok-weak);}

  /* 密钥面板 */
  .key-panel{
    position:absolute; top:calc(100% + 8px); right:0; width:320px; max-width:calc(100vw - 28px);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:0 12px 32px rgba(16,24,40,.16); padding:14px; z-index:40;
    animation:fadeIn .18s ease both;
  }
  .key-panel h4{font-size:14px; font-weight:700; margin-bottom:4px;}
  .key-panel .desc{font-size:12px; color:var(--text-3); line-height:1.65; margin-bottom:10px;}
  .key-panel input{
    width:100%; padding:10px 12px; border:1px solid var(--border-strong); border-radius:9px;
    font-size:16px; outline:none; background:var(--surface-2); transition:border-color .15s, background .15s;
  }
  .key-panel input:focus{border-color:var(--primary); background:var(--surface);}
  .key-row{display:flex; gap:8px; margin-top:10px;}
  .key-btn-act{
    flex:1; height:40px; border-radius:9px; background:var(--primary); color:#fff;
    font-size:13.5px; font-weight:700; transition:background .15s;
  }
  .key-btn-act:hover{background:var(--primary-strong);}
  .key-btn-ghost{
    height:40px; padding:0 14px; border-radius:9px; border:1px solid var(--border); color:var(--text-2); font-size:13px;
  }
  .key-btn-ghost:hover{background:var(--surface-2);}
  .key-status{font-size:12px; color:var(--text-3); margin-top:10px; display:flex; align-items:center; gap:6px; line-height:1.5;}
  .key-status.on{color:var(--ok);}

  /* ===== 消息流 ===== */
  main{flex:1; width:100%; max-width:760px; margin:0 auto; padding:62px 14px 130px; display:flex; flex-direction:column; gap:12px;}
  .feed{display:flex; flex-direction:column; gap:12px;}
  .post-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:12px 14px; animation:fadeIn .28s ease both;
  }
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .post-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .avatar{
    width:36px; height:36px; border-radius:50%; color:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700;
  }
  .post-meta{min-width:0; flex:1; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .nickname{font-size:14px; font-weight:700;}
  .post-time{font-size:12px; color:var(--text-3);}
  .floor{
    font-size:11px; font-weight:700; color:var(--primary); background:var(--primary-weak);
    padding:2px 8px; border-radius:999px; flex:none;
  }
  .post-content{font-size:14.5px; line-height:1.75; word-break:break-word; white-space:pre-wrap; overflow-wrap:anywhere;}
  .decrypting{color:var(--text-3); font-size:12.5px; display:flex; align-items:center; gap:7px; padding:4px 0;}
  .decrypting .spinner{width:13px; height:13px; border-width:2px;}

  /* 附件展示 */
  .post-files{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .file-img{border-radius:var(--radius-s); max-width:100%; max-height:340px; width:auto; display:block; object-fit:cover; border:1px solid var(--border); cursor:zoom-in;}
  .file-media{position:relative; width:100%; display:flex; justify-content:center; background:#0B0E14; border-radius:var(--radius-s); overflow:hidden;}
  .file-media video{max-width:100%; max-height:400px; width:auto; height:auto; display:block; object-fit:contain; background:#0B0E14;}
  .file-media audio{width:100%;}
  .file-img-wrap{position:relative; max-width:100%; line-height:0;}
  .video-zoom{
    position:absolute; right:10px; bottom:10px; width:42px; height:42px; border-radius:50%;
    background:rgba(255,255,255,.30); color:#fff; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,.6); z-index:5;
    box-shadow:0 2px 10px rgba(0,0,0,.45);
    transform:translateZ(0); -webkit-transform:translateZ(0);
    -webkit-tap-highlight-color:transparent;
    transition:background .15s, transform .15s;
  }
  .video-zoom:hover{background:rgba(255,255,255,.48); transform:translateZ(0) scale(1.06);}
  .video-zoom:active{background:rgba(255,255,255,.65);}
  .video-zoom svg{width:19px; height:19px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}

  /* ===== 媒体放大浮层（图片灯箱 / 视频全屏播放，自带退出键；自动横竖屏 + 全屏铺满） ===== */
  body.ov-open{overflow:hidden;}
  .media-overlay{
    position:fixed; inset:0; z-index:100; background:#000;
    display:flex; align-items:center; justify-content:center;
    animation:fadeIn .18s ease both;
  }
  .media-overlay .ov-stage{width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .media-overlay img.ov-img{max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;}
  .media-overlay video.ov-video{
    max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; background:#000;
  }
  /* 自动横竖屏 + 全屏铺满：竖屏媒体占满高度、横屏媒体占满宽度 */
  .media-overlay img.ov-img.portrait,
  .media-overlay video.ov-video.portrait{height:100%; width:auto; max-width:100%;}
  .media-overlay img.ov-img.landscape,
  .media-overlay video.ov-video.landscape{width:100%; height:auto; max-height:100%;}
  .media-overlay audio.ov-audio{width:92%;}
  .ov-close{
    position:absolute; top:calc(12px + env(safe-area-inset-top)); right:12px; width:44px; height:44px;
    border-radius:50%; background:rgba(255,255,255,.18); color:#fff; display:flex; align-items:center; justify-content:center;
    z-index:3; transition:background .15s; -webkit-tap-highlight-color:transparent;
  }
  .ov-close:hover{background:rgba(255,255,255,.36);}
  .ov-close svg{width:21px; height:21px;}
  .ov-hint{position:absolute; top:calc(18px + env(safe-area-inset-top)); left:16px; font-size:11px; color:rgba(255,255,255,.55); z-index:3;}
  /* 底部悬浮条：不占布局空间，画面真正铺满；半透明、圆角、小字号 */
  .ov-bar{
    position:absolute; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; max-width:88vw;
    background:rgba(16,20,28,.62); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:6px 8px 6px 14px; z-index:3;
  }
  .ov-bar .ov-info{min-width:0; display:flex; flex-direction:column; gap:1px;}
  .ov-bar .ov-name{font-size:12.5px; color:#E7EAEE; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:44vw;}
  .ov-bar .ov-size{font-size:11px; color:rgba(231,234,238,.6);}
  .ov-dl{
    flex:none; display:flex; align-items:center; gap:5px; background:var(--primary); color:#fff;
    border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:700; text-decoration:none;
    transition:background .15s; -webkit-tap-highlight-color:transparent;
  }
  .ov-dl:hover{background:var(--primary-strong);}
  .ov-dl svg{width:14px; height:14px;}
  .file-card{
    display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--border);
    border-radius:var(--radius-s); background:var(--surface-2); text-decoration:none; color:var(--text);
    transition:border-color .15s, background .15s; max-width:100%;
  }
  .file-card:hover{border-color:var(--border-strong); background:#F0F2F5;}
  .file-ic{
    width:38px; height:38px; border-radius:9px; background:var(--primary-weak); color:var(--primary); flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .file-ic svg{width:19px; height:19px;}
  .file-ic.type-accent{background:var(--accent-weak); color:#C77C08;}
  .file-info{min-width:0; flex:1;}
  .file-name{font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .file-sub{font-size:11.5px; color:var(--text-3); margin-top:1px;}
  .file-go{color:var(--text-3); flex:none;}
  .file-go svg{width:15px; height:15px;}
  .file-note{
    font-size:12px; color:var(--text-3); background:var(--surface-2); border:1px dashed var(--border-strong);
    border-radius:var(--radius-s); padding:10px 12px; display:flex; align-items:center; gap:8px;
  }
  .file-note svg{width:15px; height:15px; flex:none; color:var(--text-3);}
  .file-note .retry-btn{
    margin-left:auto; flex:none; border:1px solid var(--border-strong); border-radius:6px;
    padding:3px 10px; font-size:12px; color:var(--primary); background:var(--surface); transition:background .15s;
  }
  .file-note .retry-btn:hover{background:var(--surface-2);}

  /* 空态 / 加载态 */
  .empty{
    text-align:center; padding:64px 20px; color:var(--text-2);
  }
  .empty svg{width:64px; height:64px; color:#C9CFD8; margin-bottom:14px;}
  .empty .t{font-size:15px; font-weight:700; color:var(--text); margin-bottom:6px;}
  .empty .s{font-size:13px; color:var(--text-3);}
  .loading{display:flex; justify-content:center; padding:40px 0; color:var(--text-3); font-size:13px;}
  .spinner{width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== 底部输入区（fixed 固定，随输入法面板自动上移） ===== */
  .composer-wrap{
    position:fixed; left:0; right:0; bottom:calc(var(--kb-height, 0px) + env(safe-area-inset-bottom)); z-index:20;
    background:var(--surface); border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -1px 4px rgba(16,24,40,.06);
  }
  .composer-inner{max-width:760px; margin:0 auto;}
  .attach-preview{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none;}
  .attach-preview::-webkit-scrollbar{display:none;}
  .att-item{
    display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius-s); padding:5px 8px; font-size:12px; flex:none; max-width:200px;
  }
  .att-item .att-ic{width:22px; height:22px; border-radius:6px; background:var(--primary-weak); color:var(--primary); display:flex; align-items:center; justify-content:center; flex:none;}
  .att-item .att-ic svg{width:12px; height:12px;}
  .att-item .att-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:110px;}
  .att-item .att-size{color:var(--text-3); flex:none;}
  .att-item .att-rm{color:var(--text-3); flex:none; padding:2px;}
  .att-item .att-rm:hover{color:var(--danger);}
  .att-item .att-rm svg{width:13px; height:13px; display:block;}
  .composer-row{display:flex; align-items:flex-end; gap:8px;}
  .msg-input{
    flex:1; resize:none; border:1px solid var(--border-strong); border-radius:12px; background:var(--surface-2);
    padding:10px 13px; font-size:15px; line-height:1.5; min-height:42px; max-height:130px; outline:none;
    transition:border-color .15s, background .15s;
  }
  .msg-input:focus{border-color:var(--primary); background:var(--surface);}
  .msg-input::placeholder{color:var(--text-3);}
  .send-btn{
    height:42px; padding:0 20px; border-radius:12px; background:var(--primary); color:#fff;
    font-size:14.5px; font-weight:700; flex:none; transition:background .15s, opacity .15s;
  }
  .send-btn:hover{background:var(--primary-strong);}
  .send-btn:disabled{opacity:.55; cursor:not-allowed;}
  .composer-meta{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .nick-input{
    width:150px; border:1px solid transparent; border-radius:8px; background:transparent;
    padding:5px 8px; font-size:13px; color:var(--text-2); outline:none; transition:background .15s, border-color .15s;
  }
  .nick-input:hover{background:var(--surface-2);}
  .nick-input:focus{background:var(--surface-2); border-color:var(--border);}
  .composer-hint{font-size:12px; color:var(--text-3); margin-left:auto;}
  .att-sum{font-size:12px; color:var(--primary); font-weight:700; flex:none;}
  .enc-hint{font-size:12px; color:var(--ok); display:flex; align-items:center; gap:4px; font-weight:500;}
  .enc-hint svg{width:12px; height:12px;}

  /* Toast */
  .toast{
    position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:#23272E; color:#fff; font-size:13px; padding:9px 16px; border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:50; max-width:88vw;
    animation:toastIn .22s ease both;
  }
  .toast.err{background:var(--danger);}
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

  /* 响应式 */
  @media (max-width:560px){
    main{padding:58px 10px 128px;}
    .post-card{padding:11px 12px;}
    .composer-hint{display:none;}
    .nick-input{width:120px; font-size:16px;}
    .msg-input{font-size:16px;}
    .send-btn{padding:0 16px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
  /* 深色模式适配 */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111418; --surface:#1A1F26; --surface-2:#212833;
      --border:#2A303A; --border-strong:#39404C;
      --text:#E7EAEE; --text-2:#A8B0BC; --text-3:#7C8594;
      --primary:#4C8DFF; --primary-strong:#6FA3FF; --primary-weak:#1E2A44;
      --accent:#F5B23E; --accent-weak:#3A2F1A;
      --danger:#F87171; --danger-weak:#3A1F22;
      --ok:#34D399; --ok-weak:#16302A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.35);
    }
    .file-card:hover{background:#252C36;}
    .file-media video{background:#0B0E14;}
    .toast{background:#2A303A;}
  }
  [hidden]{display:none !important;}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </span>
    小鸟贴吧
    <span class="tag">社区留言板</span>
  </div>
  <div class="top-actions">
    <span id="connState" class="conn-state"><span class="dot"></span><span id="connText">连接中…</span></span>
    <button id="keyBtn" class="icon-btn" title="设置房间密钥（端到端加密）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </button>
    <button id="refreshBtn" class="icon-btn" title="刷新消息">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
    <div id="keyPanel" class="key-panel" hidden>
      <h4>房间密钥</h4>
      <div class="desc">消息与附件会用此密钥加密后存储，知道同一密钥的人才能看到内容。密钥不会上传，忘记将无法解密。</div>
      <input id="keyInput" type="password" placeholder="输入房间密钥（至少 6 位）" autocomplete="off">
      <div class="key-row">
        <button id="keyApply" class="key-btn-act">设置密钥</button>
        <button id="keyClear" class="key-btn-ghost">清除</button>
      </div>
      <div id="keyStatus" class="key-status"></div>
    </div>
  </div>
</header>

<main>
  <div id="feed" class="feed"></div>
  <div id="emptyState" class="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="10" x2="15" y2="10"/></svg>
    <div class="t">还没有人发言</div>
    <div class="s">在下方输入内容，发第一条帖子吧</div>
  </div>
  <div id="loading" class="loading"><div class="spinner"></div></div>
</main>

<footer class="composer-wrap">
  <div class="composer-inner">
    <div id="attachPreview" class="attach-preview" hidden></div>
    <div class="composer-row">

/* 文本加解密：enc:base64(iv):base64(密文) */
async function encryptText(plain){
  if(!plain) return '';
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, currentKey, new TextEncoder().encode(plain));
  return ENC_PREFIX + b64FromBytes(iv) + ':' + b64FromBytes(ct);
}
async function decryptText(payload){
  if(!payload) return { ok:true, text:'' };
  if(typeof payload !== 'string' || !payload.startsWith(ENC_PREFIX)) return { ok:true, text: payload };
  if(!currentKey) return { ok:false, needKey:true, text:'' };
  try{
    const body = payload.slice(ENC_PREFIX.length);
    const sep = body.indexOf(':');
    if(sep < 0) return { ok:true, text: payload };
    const iv = bytesFromB64(body.slice(0, sep));
    const ct = bytesFromB64(body.slice(sep + 1));
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, currentKey, ct);
    return { ok:true, text: new TextDecoder().decode(pt) };
  }catch(e){
    return { ok:false, needKey:false, text:'' };
  }
}

async function encryptFile(file){

  const data = await file.arrayBuffer();
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, currentKey, data);
  const out = new Uint8Array(iv.length + ct.byteLength);
  out.set(iv, 0);
  out.set(new Uint8Array(ct), iv.length);
  const base = (file.name || 'file').replace(/\.[^.]+$/, '') || 'file';
  return { blob: new Blob([out], { type:'application/octet-stream' }), name: base + '.enc' };
}
/* 附件下载+解密：流式下载实时显示进度；网络错误自动重试 2 次（单次 120 秒超时）；密钥不匹配立即判定 */
async function fetchWithProgress(url, onProgress){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  let res;
  try{
    res = await fetch(url, { signal: ctrl.signal });
  }catch(e){
    clearTimeout(timer);
    if(e && e.name === 'AbortError') throw new Error('附件下载超时（超过 120 秒）');
    throw e;
  }
  clearTimeout(timer);
  if(!res.ok) throw Object.assign(new Error('附件下载失败（' + res.status + '）'), { status: res.status });
  const total = Number(res.headers.get('content-length')) || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    chunks.push(value);
    got += value.length;
    if(onProgress) onProgress(total, got);
  }
  const buf = new Uint8Array(got);
  let off = 0;
  for(const c of chunks){ buf.set(c, off); off += c.length; }
  return buf;
}

  }

}

      textCache.delete(id);
    }
  }
}

/* 扫描桶内 uploads/ 全部对象（key / size / created_at），失败返回 null */
async function listBucketObjects(){
  const objs = [];

  try{
    while(true){
      const list = await apiFetch(SUPABASE_URL + '/storage/v1/object/list/' + BUCKET, {
        method: 'POST',
        headers: AUTH_HEADERS,
        body: JSON.stringify({ prefix:'uploads', limit:1000, offset })
      });
      if(!Array.isArray(list) || list.length === 0) break;
      for(const o of list){
        objs.push({
          key: (o.name || '').replace(/^uploads\//, ''),
          size: Number(o.metadata && o.metadata.size) || 0,
          created: o.created_at || ''
        });
      }
      offset += list.length;
      if(list.length < 1000) break;
    }
    return objs;
  }catch(e){
    return null; // 扫描失败：降级为不检查空间
  }
}
/* 扫描桶内 uploads/ 全部对象，累加占用字节（5 分钟缓存） */

  const objs = await listBucketObjects();
  if(!objs) return null;
  const usage = objs.reduce((s, o) => s + o.size, 0);

  return usage;
}
/* DELETE 请求统一封装：15 秒超时；401/403 标记无权限并全局降级 */
async function delFetch(url){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);

  try{
    res = await fetch(url, { method: 'DELETE', headers: AUTH_HEADERS, signal: ctrl.signal });
  }catch(e){
    clearTimeout(timer);
    return { status: 0 };
  }
  clearTimeout(timer);
  if(res.status === 401 || res.status === 403){ cleanPermOK = false; return { status: res.status }; }
  return { status: res.status, ok: res.ok };
}

/* 批量删行：一次 DELETE 多行（每批 ≤30），大幅减少请求数 */
async function deleteMessageRows(ids){
  if(!cleanPermOK || !ids.length) return false;
  const r = await delFetch(SUPABASE_URL + TABLE_PATH + '?id=in.(' + ids.join(',') + ')');
  return !!r.ok;
}
/* 删除最旧一条消息及其所有附件；成功返回 true（新排序下最旧在数组末尾） */
async function removeOldestMessage(){
  if(!messages.length) return false;
  const m = messages[messages.length - 1];
  const urls = parseAttachList(m.file_url);
  for(const u of urls){
    const key = urlToKey(u);
    if(key) await deleteStorageObject(key);
  }
  const ok = await deleteMessageRow(m.id);
  if(ok){
    messages.pop(); // 新排序：最旧在末尾，删末尾
    usageCache.t = 0; // 桶用量失效：附件已删，下次重扫才准确
    revokeAttach(m.id); // 释放该消息已解密的 blob 内存
    attachCache.delete(m.id);
    textCache.delete(m.id);
  }
  return ok;
}
/* 兜底清理孤儿文件：桶里存在、但未被任何"现存消息 + 待删消息"引用的对象
 * （历史删行成功但删文件失败的残留 / 上传中断残留），一次最多删 max 个最旧的 */
async function removeOrphanFiles(max){
  if(!cleanPermOK) return false;
  const objs = await listBucketObjects();
  if(!objs || !objs.length) return false;
  const referenced = new Set();
  const allRows = messages.concat(overflowRows);
  for(const m of allRows){
    for(const u of parseAttachList(m.file_url)){
      const key = urlToKey(u);
      if(key) referenced.add(key);
    }
  }
  const orphans = objs
    .filter(o => o.key && !referenced.has(o.key))
    .sort((a, b) => (a.created < b.created ? -1 : 1))
    .slice(0, max || 50);
  let removed = false;
  for(const o of orphans){
    if(await deleteStorageObject(o.key)) removed = true;
  }
  return removed;
}
/* 上传前：估算桶空间，不足则删最旧文件直到能放下；删完消息仍不够则兜底删孤儿；返回是否放得下 */
async function ensureBucketSpace(need){
  if(!cleanPermOK) return true;
  let usage = await getBucketUsage();
  if(usage === null) return true;
  let guard = 0;
  while(usage + need > BUCKET_LIMIT && guard++ < 30){
    const ok = await removeOldestMessage(); // 优先删带文件的最旧消息（行+附件一起）
    if(ok){
      usageCache.t = 0;
    } else {
      /* 消息删不动/删完：兜底删孤儿文件（未被任何消息引用的桶对象） */
      const cleaned = await removeOrphanFiles(50);
      if(!cleaned) break;
      usageCache.t = 0;
    }
    usage = await getBucketUsage();
    if(usage === null) return true;
  }
  return usage + need <= BUCKET_LIMIT;
}
/* 消息数超限时：删除"超出部分"（overflowRows）的后端数据（附件 + 行）。
 * 前端显示层已在 refresh / sendMessage 中立即截断到 MAX_MESSAGES 条。
 * 每轮最多处理 100 条；剩余部分由下一轮刷新时重新识别、继续删除，直至收敛。 */
async function cleanupMessages(){
  if(cleanupLock || !overflowRows.length) return;
  cleanupLock = true;
  try{
    const targets = overflowRows.splice(0, 100);
    const ids = targets.map(m => m.id);
    /* 1. 删附件（失败自动重试一次；仍失败则交给 removeOrphanFiles 兜底） */
    for(const m of targets){
      for(const u of parseAttachList(m.file_url)){
        const key = urlToKey(u);
        if(key) await deleteStorageObject(key);
      }
    }
    /* 2. 批量删行；批量失败（非权限问题）降级逐条删 */
    let ok = await deleteMessageRows(ids);
    if(!ok && cleanPermOK && ids.length){
      ok = true; // 逐条删：默认成功，任一条失败才置 false
      for(const id of ids){
        const r = await deleteMessageRow(id);
        if(!r && cleanPermOK){ ok = false; break; }
      }
    }
    if(ok){
      usageCache.t = 0; // 附件已删：桶用量失效，下次重扫
      for(const id of ids){
        revokeAttach(id); // 释放该消息已解密的 blob 内存，前端附件彻底清除
        attachCache.delete(id);
        textCache.delete(id);
      }
    }
  } finally {
    cleanupLock = false;
  }
}

/* ===== 下载（统一走 JS 触发，解密后下载，兼容手机 WebView） =====
 * - JStudio 外壳（window.AndroidBridge.saveFile）：把解密后的数据转 base64 交给
 *   原生保存到系统"下载"目录（WebView 无 DownloadListener 时 a.click 无反应）；
 * - 普通浏览器（网页版）：fetch blob 转成 ObjectURL 后 a[download]+click 触发下载；
 * - url 是 .enc 原始地址：先下载解密再存为原始文件名（绝不给乱码文件）。 */
async function downloadDecrypted(name, url){
  let blob = null;
  try{
    if(url && url.startsWith('blob:')){
      blob = await (await fetch(url)).blob();
    } else if(/^https?:\/\//i.test(url)){
      if(currentKey && /\.enc($|\?)/i.test(url)){
        const buf = await decryptFileBlob(url);
        blob = new Blob([buf], { type: 'application/octet-stream' });
      } else {
        blob = await (await fetch(url)).blob();
      }
    }
  }catch(e){ blob = null; }
  if(!blob){
    toast('下载失败：无法获取文件数据，请检查网络后重试', true);
    return;
  }
  /* 外壳原生通道：保存到手机系统"下载"目录 */
  if(window.AndroidBridge && typeof AndroidBridge.saveFile === 'function'){
    try{
      const bytes = new Uint8Array(await blob.arrayBuffer());
      if(bytes.length > 300 * 1024 * 1024){
        toast('文件超过 300MB，请用浏览器打开网页下载', true);
        return;
      }
      let bin = '';
      for(let i = 0; i < bytes.length; i += 0x8000){
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      }
      AndroidBridge.saveFile(name || 'file', btoa(bin));
      return;
    }catch(e){
      toast('原生保存失败，改用浏览器下载方式', true);
    }
  }
  const objUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = objUrl;
  a.download = name || 'file';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(objUrl); a.remove(); }, 5000);
}

/* ===== 媒体放大浮层（图片灯箱 / 视频全屏播放，自带退出键；自动横竖屏 + 全屏铺满） ===== */

/* 自动横竖屏：读取媒体真实宽高比 → 竖屏媒体旋转竖屏、横屏媒体旋转横屏，
 * 画面铺满全屏（竖屏占满高度、横屏占满宽度）。
 * 外壳（JStudio）优先：AndroidBridge.rotateScreen 真正旋转手机；
 * 网页版降级：全屏 + screen.orientation.lock。 */
function fitMediaAuto(el){
  const w = el.naturalWidth || el.videoWidth || 0;
  const h = el.naturalHeight || el.videoHeight || 0;
  if(!w || !h) return;
  const portrait = w < h;
  el.classList.toggle('portrait', portrait);
  el.classList.toggle('landscape', !portrait);
  try{
    if(window.AndroidBridge && typeof AndroidBridge.rotateScreen === 'function'){
      AndroidBridge.rotateScreen(portrait ? 'portrait' : 'landscape');
      return;
    }
  }catch(e){}
  if(isMobileScreen()){
    try{
      const doc = document.documentElement;
      const lock = () => {
        try{
          if(screen.orientation && screen.orientation.lock){
            screen.orientation.lock(portrait ? 'portrait' : 'landscape').catch(function(){});
          }
        }catch(e){}
      };
      if(doc.requestFullscreen){
        if(document.fullscreenElement){ lock(); }
        else { doc.requestFullscreen().then(lock).catch(function(){}); }
      } else { lock(); }
    }catch(e){}
  }
}
function openMediaOverlay(kind, url, name, size){
  closeMediaOverlay(true);
  /* 打开放大浮层时，立即暂停页面上所有其它媒体（未放大的视频/音频全部停止） */
  document.querySelectorAll('video,audio').forEach(m => {
    if(!m.paused){ try{ m.pause(); }catch(e){} }
  });
  let mediaEl = null;
  const ov = document.createElement('div'); ov.className = 'media-overlay';
  const stage = document.createElement('div'); stage.className = 'ov-stage';
  if(kind === 'image'){
    const img = document.createElement('img');
    img.className = 'ov-img'; img.src = url; img.alt = name || '图片';
    img.addEventListener('load', () => fitMediaAuto(img));
    /* 放大后仍加载失败：给明确提示 + 下载入口，不再一片黑 */
    img.addEventListener('error', () => {
      const note = noteEl('图片无法显示（附件缺失或格式不支持）');
      const btn = document.createElement('button');
      btn.className = 'retry-btn'; btn.textContent = '下载原文件';
      btn.addEventListener('click', e => { e.stopPropagation(); downloadDecrypted(name || 'file', url); });
      note.appendChild(btn);
      stage.replaceChildren(note);
    });
    stage.appendChild(img);
    mediaEl = img;
  } else if(kind === 'video'){
    const v = document.createElement('video');
    v.className = 'ov-video'; v.src = url; v.controls = true; v.autoplay = true;
    v.setAttribute('playsinline','');
    /* 自动横竖屏：加载元数据后按实际宽高比旋转并铺满全屏 */
    v.addEventListener('loadedmetadata', () => fitMediaAuto(v));
    stage.appendChild(v);
    mediaEl = v;
    /* 显式播放：紧跟用户点击（放大手势内），画面与声音一起播，
       不受自动播放策略拦截；万一被拦，数据就绪后再试一次 */
    const tryPlay = () => { const p = v.play(); if(p && p.catch) p.catch(() => {}); };
    tryPlay();
    v.addEventListener('canplay', tryPlay, { once: true });
  } else if(kind === 'audio'){
    const a = document.createElement('audio');
    a.className = 'ov-audio'; a.src = url; a.controls = true; a.autoplay = true;
    stage.appendChild(a);
    /* 音频同样显式播放 */
    const tryPlay = () => { const p = a.play(); if(p && p.catch) p.catch(() => {}); };
    tryPlay();
  }
  const close = document.createElement('button');
  close.className = 'ov-close'; close.title = '退出（Esc）';
  close.innerHTML = ovIcon('close');
  close.addEventListener('click', e => { e.stopPropagation(); closeMediaOverlay(); });
  const hint = document.createElement('div'); hint.className = 'ov-hint';
  hint.textContent = kind === 'video' ? '点击画面播放/暂停' : (kind === 'audio' ? '音频预览' : '点击画面放大');
  /* 底部悬浮条（悬浮在画面上，不挤小画面）：文件名 + 大小 + 下载键 */
  const bar = document.createElement('div'); bar.className = 'ov-bar';
  const info = document.createElement('div'); info.className = 'ov-info';
  const nm = document.createElement('div'); nm.className = 'ov-name'; nm.textContent = name || '';
  info.appendChild(nm);
  if(size){ const sz = document.createElement('div'); sz.className = 'ov-size'; sz.textContent = fmtSize(size); info.appendChild(sz); }
  const dl = document.createElement('a');
  dl.className = 'ov-dl'; dl.href = '#'; dl.rel = 'noopener';
  dl.innerHTML = ovIcon('dl') + '下载';
  dl.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); downloadDecrypted(name || 'file', url); });
  bar.appendChild(info); bar.appendChild(dl);
  ov.appendChild(stage); ov.appendChild(close); ov.appendChild(hint); ov.appendChild(bar);
  /* 点击遮罩空白处关闭（点击媒体本身不关闭） */
  ov.addEventListener('click', e => { if(e.target === ov || e.target === stage) closeMediaOverlay(); });
  document.body.appendChild(ov);
  document.body.classList.add('ov-open');
  activeOverlay = ov;
  /* 图片可能已缓存完成：立即按宽高比自动旋转；未完成则等 load 事件 */
  if(kind === 'image' && mediaEl.complete && mediaEl.naturalWidth) fitMediaAuto(mediaEl);
}
function isMobileScreen(){
  try{
    return window.matchMedia('(max-width: 820px)').matches || ('ontouchstart' in window);
  }catch(e){ return false; }
}
function exitLandscapeMode(){
  try{
    if(window.AndroidBridge && typeof AndroidBridge.rotateScreen === 'function'){
      AndroidBridge.rotateScreen('portrait');
    }
  }catch(e){}
  try{
    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
  }catch(e){}
  try{
    if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  }catch(e){}
}
function closeMediaOverlay(skipPause){
  exitLandscapeMode();
  if(activeOverlay){
    if(!skipPause){
      const m = activeOverlay.querySelector('video,audio');
      if(m && typeof m.pause === 'function'){ try{ m.pause(); }catch(e){} }
    }
    activeOverlay.remove();
    activeOverlay = null;
  }
  document.body.classList.remove('ov-open');
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMediaOverlay(); });

/* 附件渲染（支持加密文件：下载→解密→blob 预览） */
function renderDirectFile(container, f){
  if(f.kind === 'image'){
    const a = document.createElement('a');
    a.href = f.url; a.target = '_blank'; a.rel = 'noopener';
    const img = document.createElement('img');
    img.className = 'file-img'; img.src = f.url; img.alt = f.name; img.loading = 'lazy';
    img.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); openMediaOverlay('image', f.url, f.name, f.size); });
    /* 图片加载失败（附件被清理/网络失败/格式不支持）：给明确提示 + 下载入口，不留黑图 */
    img.addEventListener('error', () => {
      const note = noteEl('图片无法显示（附件缺失或格式不支持）');
      const btn = document.createElement('button');
      btn.className = 'retry-btn'; btn.textContent = '下载原文件';
      btn.addEventListener('click', e2 => { e2.stopPropagation(); downloadDecrypted(f.dl || f.name || 'file', f.url); });
      note.appendChild(btn);
      a.replaceWith(note);
    });
    a.appendChild(img); container.appendChild(a);
  } else if(f.kind === 'video'){
    const wrap = document.createElement('div'); wrap.className = 'file-media';
    const v = document.createElement('video'); v.src = f.url; v.controls = true; v.preload = 'metadata'; v.setAttribute('playsinline','');
    let zoom = null;
    /* 解码失败（如 HEVC 等浏览器不支持的编码）：给明确提示，不留下无声黑屏 */
    v.addEventListener('error', () => {
      if(v.error || v.networkState === v.NETWORK_NO_SOURCE){
        const note = noteEl('视频解码失败：该编码（如 HEVC）当前浏览器不支持，建议下载后本地播放');
        v.replaceWith(note);
        if(zoom) zoom.remove();
      }
    });
    zoom = document.createElement('button');
    zoom.className = 'video-zoom'; zoom.title = '放大播放';
    zoom.innerHTML = ovIcon('zoom');
    zoom.addEventListener('click', e => { e.stopPropagation(); openMediaOverlay('video', f.url, f.name, f.size); });
    v.addEventListener('click', () => openMediaOverlay('video', f.url, f.name, f.size));
    wrap.appendChild(v); wrap.appendChild(zoom); container.appendChild(wrap);
  } else if(f.kind === 'audio'){
    const wrap = document.createElement('div'); wrap.className = 'file-media';
    const a = document.createElement('audio'); a.src = f.url; a.controls = true; a.preload = 'metadata';
    wrap.appendChild(a); container.appendChild(wrap);
  } else {
    const a = document.createElement('a'); a.className = 'file-card';
    a.href = '#'; a.rel = 'noopener';
    a.addEventListener('click', e => { e.preventDefault(); downloadDecrypted(f.dl || f.name || 'file', f.url); });
    const ic = document.createElement('span'); ic.className = 'file-ic' + (['zip','xls','ppt'].includes(extIcon(f.name)) ? ' type-accent' : '');
    ic.innerHTML = fileIconSvg(extIcon(f.name));
    const info = document.createElement('span'); info.className = 'file-info';
    const nm = document.createElement('div'); nm.className = 'file-name'; nm.textContent = f.name;
    const sub = document.createElement('div'); sub.className = 'file-sub';
    sub.textContent = (f.type || '文件').toUpperCase() + (f.size ? ' · ' + fmtSize(f.size) : '');
    info.appendChild(nm); info.appendChild(sub);
    const go = document.createElement('span'); go.className = 'file-go';
    go.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>';
    a.appendChild(ic); a.appendChild(info); a.appendChild(go);
    container.appendChild(a);
  }
}
/* 多附件渲染：file_url 可能是 JSON 数组（新）或单个 URL（旧数据），逐个渲染 */
function parseAttachList(raw){
  if(typeof raw !== 'string' || !raw) return [];
  let urls = [];
  if(raw.trim().startsWith('[')){
    try{ urls = JSON.parse(raw); }catch(e){ urls = []; }
  } else {
    urls = [raw];
  }
  return urls.filter(u => typeof u === 'string' && /^https?:\/\//i.test(u));
}
function parseAttachMeta(raw){
  if(typeof raw !== 'string' || !raw) return [];
  let arr = [];
  if(raw.trim().startsWith('[')){
    try{ arr = JSON.parse(raw); }catch(e){ arr = []; }
  } else {
    arr = [raw];
  }
  return arr;
}
/* 单附件处理：返回渲染描述对象，由 renderAttachment 统一渲染并缓存（避免轮询时重复下载解密） */
async function renderOneFile(id, url, name, type, prog){
  const kind = type ? fileKind(type, name) : 'file';
  /* URL 含非法百分号编码时 decodeURIComponent 会抛错：降级用原始末段，避免附件卡在加载 */
  let lastSeg = '';
  try{ lastSeg = decodeURIComponent(url.split('/').pop() || ''); }
  catch(e){ lastSeg = url.split('/').pop() || ''; }
  const isEnc = /\.enc($|\?)/i.test(lastSeg);
  if(!isEnc){
    return { url, name, kind, type, ok: true };
  }
  if(!currentKey){
    return { url, name, kind, type, ok: false, needKey: true };
  }
  /* 黑名单命中：密钥对不上，直接跳过，不下载不解密 */
  if(badKeyIds.has(id)){
    return { url, name, kind, type, ok: false, needKey: false, badKey: true };
  }
  try{
    if(prog){ prog.phase = 'download'; prog.pct = 0; prog.sizeText = ''; paintProgress(prog); }
    const pt = await decryptFileBlob(url, (total, got) => {
      if(!prog) return;
      prog.pct = total ? Math.round(got / total * 100) : 0;
      prog.sizeText = (total ? fmtSize(got) + ' / ' + fmtSize(total) : fmtSize(got));
      paintProgress(prog);
    });
    if(prog){ prog.phase = 'decrypt'; paintProgress(prog); }
    const blob = new Blob([pt], { type: mimeFromName(name, type) });
    const blobUrl = URL.createObjectURL(blob);
    return { url: blobUrl, name, kind, type, size: blob.size, dl: name, blobUrl, ok: true };
  }catch(e){
    if(e && e.auth){
      badKeyIds.add(id);
      saveBadKeys();
      return { url, name, kind, type, ok: false, needKey: false };
    }
    if(e && e.status === 404){
      /* 附件已被自动清理或删除 */
      return { url, name, kind, type, ok: false, deleted: true };
    }
    /* 网络/下载失败：可重试 */
    return { url, name, kind, type, ok: false, needKey: false, netErr: true };
  }
}
/* 进度显示：实时更新；页面刷新重建后自动改指向新元素 */
function paintProgress(prog){
  if(!prog || !prog.el || !prog.el.isConnected) return;
  if(prog.phase === 'download'){
    prog.el.textContent = prog.pct > 0
      ? '正在下载附件 ' + prog.i + '/' + prog.n + '（' + prog.pct + '% ' + prog.sizeText + '）'
      : '正在下载附件 ' + prog.i + '/' + prog.n + '…';
  } else {
    prog.el.textContent = '正在解密附件 ' + prog.i + '/' + prog.n + '…';
  }
}
/* 把解密结果渲染进容器（含失败/重试分支） */
function renderFilesInto(container, files, rowId){
  container.innerHTML = '';
  files.forEach(f => {
    if(!f.ok){
      const note = noteEl(
        f.deleted ? '附件已被清理（旧消息自动清理时移除）'
        : f.badKey ? '附件密钥不匹配，已跳过（可点密钥按钮换密钥后查看）'
        : f.needKey ? '加密附件：设置房间密钥后可查看'
        : f.netErr ? '附件下载失败，请检查网络后重试'
        : '附件无法解密（房间密钥不正确）'
      );
      if(f.netErr){
        const btn = document.createElement('button');
        btn.className = 'retry-btn'; btn.textContent = '重试';
        btn.addEventListener('click', () => {
          const entry = attachCache.get(rowId);
          if(entry){ entry.files = null; entry.promise = null; }
          const row = messages.find(m => m.id === rowId);
          if(row) renderAttachment(container, row);
        });
        note.appendChild(btn);
      }
      container.appendChild(note);
      return;
    }
    renderDirectFile(container, f);
  });
}
/* 多附件渲染：缓存"解密任务"本身（Promise），
 * 轮询刷新复用同一任务，绝不重复下载；解密完成立即上屏 */
async function renderAttachment(container, row){
  const rawUrl = row.file_url;
  const urls = parseAttachList(rawUrl);
  if(urls.length === 0){
    container.innerHTML = '';
    /* 指定了附件字段但没有有效文件：明确提示"没有此文件"
     * （独立于解密流程：纯字段检查，不涉及下载/解密）
     * 覆盖 file_url 为 'null' 字符串、'[]'、无效 URL 等脏数据场景 */
    if(rawUrl && String(rawUrl).trim()){
      container.appendChild(noteEl('没有此文件（附件缺失或已被清理）'));
    }
    return;
  }
  let entry = attachCache.get(row.id);
  if(!entry){
    const prog = { phase:'download', pct:0, i:1, n:urls.length, sizeText:'', el:null };
    const promise = (async () => {
      const nameRes = await decryptText(row.file_name);
      const nameText = nameRes.ok ? (nameRes.text || '') : '';
      const names = nameText ? parseAttachMeta(nameText) : [];
      const types = parseAttachMeta(row.file_type);
      const files = [];
      /* 串行下载解密，避免多个大文件并发争抢带宽 */
      for(let i = 0; i < urls.length; i++){
        prog.i = i + 1; prog.n = urls.length;
        const name = (names && names[i]) || ('附件' + (i + 1));
        const type = (types && types[i]) || 'application/octet-stream';
        files.push(await renderOneFile(row.id, urls[i], name, type, prog));
      }
      return files;
    })();
    entry = { promise, files: null, prog };
    attachCache.set(row.id, entry);
    cacheOrder.push(row.id);
    trimCache();
    promise.then(files => {
      entry.files = files;
      /* 解密完成：若该卡片还在页面中，立即渲染，不等下一轮刷新 */
      const box = document.querySelector('.post-files[data-id="' + row.id + '"]');
      if(box) renderFilesInto(box, files, row.id);
    }).catch(() => {});
  }
  if(entry.files){
    /* 已渲染过且容器里有实际内容（图片/媒体/文件卡片/提示）→ 不重复渲染，
       避免替换正在播放或系统全屏中的视频节点（否则会退出全屏） */
    const rendered = container.querySelector('.file-img, .file-media, .file-card, .file-note');
    if(rendered) return;
    renderFilesInto(container, entry.files, row.id);
    return;
  }
  /* 解密进行中：显示实时进度占位（复用同一任务） */
  container.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'decrypting';
  d.innerHTML = '<span class="spinner"></span><span class="d-text"></span>';
  container.appendChild(d);
  entry.prog.el = d.querySelector('.d-text');
  paintProgress(entry.prog);
}
const attachIO = ('IntersectionObserver' in window)
  ? new IntersectionObserver(entries => {
      entries.forEach(en => {
        if(en.isIntersecting){
          const el = en.target;
          attachIO.unobserve(el);
          /* 兼容数字/字符串两种 id：dataset 里存的是字符串，cardMap 的 key 可能是数字 */
          const entry = cardMap.get(el.dataset.id) || cardMap.get(Number(el.dataset.id));
          if(entry) renderAttachment(el, entry.row);
        }
      });
    }, { rootMargin: '240px' })
  : null;

/* 消息卡片：先骨架，再异步解密填充（解密结果缓存，刷新不重复解密） */
async function fillCard(card, row){
  let nickText, contentText = '', contentState = 'none';
  const cached = textCache.get(row.id);
  if(cached){
    nickText = cached.nick;
    contentText = cached.content;
    contentState = cached.contentState;
  } else {
    const nickRes = await decryptText(row.nickname);
    nickText = nickRes.ok ? (nickRes.text || '匿名') : (nickRes.needKey ? '需密钥' : '无法解密');
    if(row.content){
      const cRes = await decryptText(row.content);
      contentText = cRes.ok ? cRes.text : '';
      contentState = cRes.ok ? 'ok' : (cRes.needKey ? 'needKey' : 'fail');
    }
    textCache.set(row.id, { nick: nickText, content: contentText, contentState });
  }
  const nickEl = card.querySelector('.nickname'); if(nickEl) nickEl.textContent = nickText;
  const avEl = card.querySelector('.avatar');
  if(avEl){ avEl.textContent = nickText[0]; avEl.style.background = avatarColor(nickText); }
  const bodyEl = card.querySelector('.post-content');
  if(bodyEl){
    bodyEl.innerHTML = '';
    if(contentState === 'ok'){
      if(contentText) bodyEl.textContent = contentText;
    } else if(contentState === 'needKey'){
      bodyEl.appendChild(noteEl('加密消息：输入房间密钥后查看'));
    } else if(contentState === 'fail'){
      bodyEl.appendChild(noteEl('无法解密（房间密钥不正确）'));
    }
  }
}
/* 已渲染卡片缓存：id -> {el, row}；增量渲染时复用，不重建（不打断正在播放的视频） */
const cardMap = new Map();
/* 上次渲染的消息 id 序列（最新在上，逗号连接）：用于"消息无变化时跳过重建" */
let lastIdsKey = '';
/* 清空卡片缓存：同步移除已渲染卡片，避免"Map 已清、DOM 残留旧卡"的竞态窗口 */
function clearCardMap(){
  lastIdsKey = ''; // 强制下一次刷新全量重建（换密钥/清空后必须重渲染）
  for(const entry of cardMap.values()){ if(entry.el && entry.el.isConnected) entry.el.remove(); }
  cardMap.clear();
}
function buildCard(row, i){
  const card = document.createElement('article'); card.className = 'post-card';
  card.dataset.id = row.id;
  const head = document.createElement('div'); head.className = 'post-head';
  const av = document.createElement('span'); av.className = 'avatar'; av.style.background = '#C9CFD8'; av.textContent = '?';
  const meta = document.createElement('div'); meta.className = 'post-meta';
  const nick = document.createElement('span'); nick.className = 'nickname'; nick.textContent = '解密中…';
  const time = document.createElement('span'); time.className = 'post-time'; time.textContent = fmtTime(row.created_at);
  meta.appendChild(nick); meta.appendChild(time);
  const floor = document.createElement('span'); floor.className = 'floor'; floor.textContent = '#' + (i + 1);
  head.appendChild(av); head.appendChild(meta); head.appendChild(floor);
  card.appendChild(head);
  if(row.content){
    const body = document.createElement('div'); body.className = 'post-content';
    const d = document.createElement('span'); d.className = 'decrypting'; d.innerHTML = '<span class="spinner"></span>解密中…';
    body.appendChild(d); card.appendChild(body);
  }
  if(row.file_url){
    const files = document.createElement('div'); files.className = 'post-files';
    files.dataset.id = row.id;
    const d = document.createElement('div'); d.className = 'decrypting'; d.innerHTML = '<span class="spinner"></span>解密附件…';
    files.appendChild(d);
    card.appendChild(files);
    if(attachIO) attachIO.observe(files); else renderAttachment(files, row);
  }
  return card;
}
/* 增量渲染：只新增/删除/排序，已存在的卡片原地复用（正在播放的视频/音频不会被刷新打断） */
function renderFeed(scrollBottom){
  if(messages.length === 0){
    feedEl.innerHTML = '';
    clearCardMap();
    emptyEl.hidden = false; loadingEl.hidden = true; return;
  }
  emptyEl.hidden = true; loadingEl.hidden = true;
  const idsKey = messages.map(m => m.id).join(',');
  /* 关键优化：消息 id 序列与上次完全一致 → 不重建 DOM
   * 解决①：刷新导致列表上下偏移、滚动位置跳动（旧逻辑每次都清空重建 feed）；
   * 解决②：正在系统全屏播放的视频被 detach 重建导致退出全屏。
   * 此时只轻量刷新相对时间与楼层号文本，页面结构与滚动位置 100% 保持。 */
  if(idsKey === lastIdsKey && feedEl.childElementCount > 0){
    messages.forEach((row, i) => {
      const entry = cardMap.get(row.id);
      if(entry){
        const t = entry.el.querySelector('.post-time');
        if(t) t.textContent = fmtTime(row.created_at);
        const floor = entry.el.querySelector('.floor');
        if(floor) floor.textContent = '#' + (i + 1);
      }
    });
    return;
  }
  lastIdsKey = idsKey;
  const ids = new Set(messages.map(m => m.id));
  /* 1. 移除已消失的卡片 */
  for(const [id, entry] of cardMap){
    if(!ids.has(id)){ entry.el.remove(); cardMap.delete(id); }
  }
  /* 2. 按新顺序逐个归位；缺失的现场新建（最新在上：messages[0] 最新） */
  const frag = document.createDocumentFragment();
  messages.forEach((row, i) => {
    let entry = cardMap.get(row.id);
    if(!entry){
      entry = { el: buildCard(row, i), row };
      cardMap.set(row.id, entry);
      fillCard(entry.el, row);
    } else {
      /* 已存在：只更新楼层号与相对时间，不改动其它 DOM（播放中的媒体不受影响） */
      const floor = entry.el.querySelector('.floor');
      if(floor) floor.textContent = '#' + (i + 1);
      const time = entry.el.querySelector('.post-time');
      if(time) time.textContent = fmtTime(row.created_at);
    }
    frag.appendChild(entry.el);
  });
  feedEl.innerHTML = '';
  feedEl.appendChild(frag);
  if(scrollBottom) window.scrollTo({ top: 0, behavior: 'smooth' }); // 最新在上：发送后回到顶部
}

/* ===== Toast ===== */
let toastTimer = null;
function toast(msg, isErr){
  toastEl.textContent = msg;
  toastEl.className = 'toast' + (isErr ? ' err' : '');
  toastEl.hidden = false;
  clearTimeout(toastTimer);

}

/* ===== 附件管理 ===== */
function pendingTotalSize(){
  return pendingFiles.reduce((s, it) => s + (it.file.size || 0), 0);
}
function isDuplicate(file){
  return pendingFiles.some(it => it.file.name === file.name && it.file.size === file.size);
}
function updateAttachSummary(){
  if(pendingFiles.length === 0){ attSummary.hidden = true; return; }
  attSummary.hidden = false;
  attSummary.textContent = pendingFiles.length + ' 个附件 · ' + fmtSize(pendingTotalSize());
}
function updateAttachPreview(){
  attachPreview.innerHTML = '';
  if(pendingFiles.length === 0){ attachPreview.hidden = true; updateAttachSummary(); return; }
  attachPreview.hidden = false;
  pendingFiles.forEach((item, idx) => {
    const el = document.createElement('div'); el.className = 'att-item';
    const ic = document.createElement('span'); ic.className = 'att-ic';
    ic.innerHTML = fileIconSvg(extIcon(item.file.name));
    const nm = document.createElement('span'); nm.className = 'att-name'; nm.textContent = item.file.name;
    const sz = document.createElement('span'); sz.className = 'att-size'; sz.textContent = fmtSize(item.file.size);
    const rm = document.createElement('button'); rm.className = 'att-rm'; rm.title = '移除';
    rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    rm.addEventListener('click', () => { pendingFiles.splice(idx, 1); updateAttachPreview(); });
    el.appendChild(ic); el.appendChild(nm); el.appendChild(sz); el.appendChild(rm);
    attachPreview.appendChild(el);
  });
  updateAttachSummary();
}
function addFiles(fileList){
  const arr = Array.from(fileList);
  for(const f of arr){
    if(pendingFiles.length >= MAX_FILES){
      toast('一次最多发送 ' + MAX_FILES + ' 个附件，其余未添加', true);
      break;
    }
    if(f.size > MAX_FILE_SIZE){
      toast('「' + f.name + '」超过 ' + fmtLimit(MAX_FILE_SIZE) + ' 单文件限制，未添加', true);
      continue;
    }
    if(isDuplicate(f)){
      toast('「' + f.name + '」已在列表中，不重复添加', true);
      continue;
    }
    if(pendingTotalSize() + f.size > MAX_TOTAL_SIZE){
      toast('附件累积将超过 ' + fmtLimit(MAX_TOTAL_SIZE) + '，「' + f.name + '」未添加', true);
      continue;
    }
    pendingFiles.push({ file: f });
  }
  updateAttachPreview();
}

/* ===== 上传 & 发送（全程加密） ===== */
/* Supabase Storage 拒绝含中文/非 ASCII 字符的对象 key（报 Invalid key）。
 * 照片视频默认英文名能传，中文名文件（如"测试文件.txt"）上传必失败。
 * 上传 key 一律转成纯 ASCII 安全名；真实文件名走加密的 file_name 字段，用户无感知。 */
function safeKeyName(name){
  const ascii = (name || 'file')
    .replace(/[^\x21-\x7E]+/g, '_') // 非 ASCII（中文等）→ 下划线
    .replace(/[\\\/:*?"<>|]+/g, '_') // 非法文件名字符 → 下划线
    .replace(/_+/g, '_')
    .trim();
  return (ascii || 'file').slice(0, 60);
}
async function uploadFile(blob, name){
  const safeName = safeKeyName(name);
  const path = 'uploads/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '-' + safeName;
  const url = SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path;
  let res;
  try{ res = await fetch(url, {
    method: 'POST',
    headers: {
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + ANON_KEY,
      'Content-Type': 'application/octet-stream',
      'x-upsert': 'true',
      'cache-control': 'public, max-age=31536000'
    },
    body: blob
  }); }
  catch(e){ throw new Error('文件上传失败：网络错误'); }
  if(!res.ok){
    let msg = '文件上传失败（' + res.status + '）';
    try{ const j = await res.json(); if(j.message) msg = '文件上传失败：' + j.message; }catch(e){}
    throw new Error(msg);
  }
  return SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path;
}

async function sendMessage(){
  if(busy) return;
  const content = msgInput.value.trim();
  if(!content && pendingFiles.length === 0){
    toast('写点内容或添加一个附件'); return;
  }
  if(!CRYPTO_OK){
    toast('当前环境不支持加密，请通过 https 打开页面', true);
    return;
  }
  if(!currentKey){
    toast('请先设置房间密钥再发送');
    keyPanel.hidden = false;
    keyInput.focus();
    return;
  }
  busy = true;
  sendBtn.disabled = true;
  sendBtn.textContent = '加密发送中…';
  try{
    /* 上传前：若带附件，估算桶空间，不足则自动删最旧文件腾空间 */
    if(pendingFiles.length){
      const need = pendingTotalSize();
      const enough = await ensureBucketSpace(need);
      if(!enough){
        toast('存储空间不足：已尝试清理旧文件仍放不下，请手动清理或扩容', true);
        return;
      }
    }
    const uploaded = [];
    for(const item of pendingFiles){
      try{
        const ef = await encryptFile(item.file);
        const url = await uploadFile(ef.blob, ef.name);
        uploaded.push({ url, name: item.file.name, type: item.file.type || 'application/octet-stream' });
      }catch(e){
        toast(e.message, true);
        throw e;
      }
    }
    const row = {
      nickname: await encryptText((nickInput.value.trim() || '匿名').slice(0, 20)),
      content: await encryptText(content),
      /* 多附件：打包成 JSON 数组存进单值字段（兼容旧版单附件数据） */
      file_url: uploaded.length ? JSON.stringify(uploaded.map(u => u.url)) : null,
      file_name: uploaded.length ? await encryptText(JSON.stringify(uploaded.map(u => u.name))) : null,
      file_type: uploaded.length ? JSON.stringify(uploaded.map(u => u.type)) : null
    };
    const created = await apiFetch(SUPABASE_URL + TABLE_PATH, {
      method: 'POST',
      headers: Object.assign({ 'Prefer': 'return=representation' }, AUTH_HEADERS),
      body: JSON.stringify(row)
    });
    if(Array.isArray(created) && created.length){
      messages.unshift(created[0]); // 新排序：最新消息插到顶部
      if(messages.length > MAX_MESSAGES){
        /* 发送后超限：立即截断显示 + 后台删后端（附件 + 行） */
        overflowRows = messages.splice(MAX_MESSAGES);
        renderFeed(true);
        cleanupMessages();
      } else {
        renderFeed(true);
      }
    } else {
      await refresh(false);
    }
    msgInput.value = ''; autoGrow();
    pendingFiles = []; updateAttachPreview();
    saveNick();
    /* 发送成功后：消息数超限则清理最旧（尽力而为） */
    cleanupMessages();
  } catch(e){
    toast(e.message, true);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    sendBtn.textContent = '发送';
  }
}

/* ===== 刷新 & 轮询 ===== */
let connRetryTimer = null;
async function refresh(manual){
  try{
    const rows = await loadMessages();
    const had = messages.length;
    if(rows.length > MAX_MESSAGES){
      /* 超限：立即截断显示（只渲染最新 MAX_MESSAGES 条，无 200→100 闪动），
         超出部分记入 overflowRows，后台删后端（附件 + 行） */
      overflowRows = rows.slice(MAX_MESSAGES);
      messages = rows.slice(0, MAX_MESSAGES);
    } else {
      overflowRows = [];
      messages = rows;
    }
    renderFeed(manual && had === 0);
    setConn(true);
    if(overflowRows.length) cleanupMessages(); // 后台尽力删后端（互斥锁防并发）
  }catch(e){
    setConn(false, e.message);
    if(manual) toast(e.message, true);
    /* 连接失败后 8 秒自动重试，网络恢复后自动连上，无需手动刷新 */
    clearTimeout(connRetryTimer);
    connRetryTimer = setTimeout(() => { if(!busy) refresh(false); }, 8000);
  }
}
function setConn(ok, msg){
  connEl.classList.toggle('on', ok);
  connEl.classList.toggle('off', !ok);
  connText.textContent = ok ? '已连接' : (msg || '连接失败');
  connText.title = ok ? '' : (msg || '');
}
/* 是否有附件正在下载/解密中：下载期间暂停自动轮询，避免抢带宽拖慢大文件 */
function hasPendingDownload(){
  for(const e of attachCache.values()){ if(e && !e.files) return true; }
  return false;
}
function autoGrow(){
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 130) + 'px';
}

/* ===== 事件 ===== */
/* 媒体互斥：同一时间只允许一个视频/音频播放，新的开始播放时自动暂停其它所有媒体 */
document.addEventListener('play', e => {
  const t = e.target;
  if(!t || (t.tagName !== 'VIDEO' && t.tagName !== 'AUDIO')) return;
  document.querySelectorAll('video,audio').forEach(m => {
    if(m !== t && !m.paused) m.pause();
  });
}, true);
fileBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
msgInput.addEventListener('input', autoGrow);
msgInput.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault(); sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);
$('refreshBtn').addEventListener('click', () => {
  const b = $('refreshBtn'); b.style.opacity = .5;
  refresh(true).finally(() => { b.style.opacity = 1; });
});
nickInput.addEventListener('change', saveNick);
nickInput.addEventListener('blur', () => { if(!nickInput.value.trim()) nickInput.value = '匿名'; });

/* 密钥面板 */
keyBtn.addEventListener('click', e => {
  e.stopPropagation();
  keyPanel.hidden = !keyPanel.hidden;
  if(!keyPanel.hidden) keyInput.focus();
});
document.addEventListener('click', e => {
  if(!keyPanel.hidden && !keyPanel.contains(e.target) && e.target !== keyBtn) keyPanel.hidden = true;
});
keyInput.addEventListener('keydown', e => { if(e.key === 'Enter') keyApply.click(); });
keyApply.addEventListener('click', async () => {
  const pwd = keyInput.value;
  if(pwd.length < 6){ toast('房间密钥至少 6 位', true); return; }
  try{
    await setPassword(pwd);
    keyInput.value = '';
    keyPanel.hidden = true;
    toast('已开启端到端加密');
  }catch(e){
    toast('加密初始化失败：' + (e && e.message || '未知错误'), true);
  }
});
keyClear.addEventListener('click', () => {
  clearKey();
  keyPanel.hidden = true;
  toast('已清除密钥，仅可查看历史明文消息');
});

/* 拖拽上传（可选增强） */
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

/* ===== 输入法面板适配 ===== */
/* 输入法弹起时，视觉视口缩小，把输入栏整体抬到键盘上方（visualViewport 方案，兼容 iOS/微信/安卓） */
function fitComposer(){
  let kb = 0;
  if(window.visualViewport){
    const vv = window.visualViewport;
    kb = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
  }
  document.documentElement.style.setProperty('--kb-height', kb + 'px');
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', fitComposer);
  window.visualViewport.addEventListener('scroll', fitComposer);
}
window.addEventListener('resize', fitComposer);
fitComposer();

/* ===== 初始化 ===== */
/* 初始化：try-catch 保护，任何单点错误都不影响页面交互（密钥按钮始终可点） */
try{
  /* 附件限制联动：限制量 >1 时才允许多选；按钮提示随配置显示 */
  fileInput.multiple = MAX_FILES > 1;
  fileBtn.title = '添加附件（图片/视频/音频/文档，单个≤' + fmtLimit(MAX_FILE_SIZE) + '）';
  loadNick();
  loadBadKeys();
  renderFeed(false);
}catch(e){
  console.error('初始化错误:', e);
}
if(!CRYPTO_OK){
  toast('当前环境不支持加密，请通过 https 打开页面', true);
  refresh(false);
}else{
  loadSavedKey()
    .then(() => refresh(false))
    .catch(e => console.error('密钥加载失败:', e));
}
setInterval(() => { if(document.visibilityState === 'visible' && !busy && !hasPendingDownload()) refresh(false); }, POLL_MS);
</script>
</body>
</html>
