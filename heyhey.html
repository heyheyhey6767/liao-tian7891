<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小鸟贴吧 · 社区留言板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563EB'/%3E%3Ctext x='32' y='44' font-size='36' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E鸟%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#FAFBFC;
    --border:#E6E8EC; --border-strong:#D6DAE1;
    --primary:#2563EB; --primary-strong:#1D4ED8; --primary-weak:#EAF1FE;
    --accent:#F59E0B; --accent-weak:#FEF3E2;
    --text:#1B1F26; --text-2:#69707A; --text-3:#9AA1AB;
    --danger:#DC2626; --danger-weak:#FEF2F2;
    --ok:#16A34A; --ok-weak:#EAF7EF;
    --radius:12px; --radius-s:8px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --font:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font); background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; min-height:100dvh; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,textarea{font-family:inherit; color:inherit;}
  a{color:var(--primary);}

  /* ===== 顶部栏 ===== */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border); padding:10px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand{display:flex; align-items:center; gap:9px; font-size:17px; font-weight:700; letter-spacing:.5px;}
  .brand-logo{width:28px; height:28px; border-radius:8px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; flex:none;}
  .brand-logo svg{width:16px; height:16px;}
  .brand .tag{font-size:11px; font-weight:500; color:var(--text-3); background:var(--surface-2); border:1px solid var(--border); padding:2px 8px; border-radius:999px; letter-spacing:0;}
  .top-actions{display:flex; align-items:center; gap:10px; position:relative;}
  .conn-state{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-2);}
  .conn-state .dot{width:7px; height:7px; border-radius:50%; background:var(--text-3); flex:none;}
  .conn-state.on .dot{background:var(--ok);}
  .conn-state.off .dot{background:var(--danger);}
  .icon-btn{
    width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    color:var(--text-2); border:1px solid var(--border); background:var(--surface);
    transition:background .15s, color .15s;
  }
  .icon-btn:hover{background:var(--surface-2); color:var(--text);}
  .icon-btn svg{width:16px; height:16px;}
  .icon-btn.key-on{color:var(--ok); border-color:var(--ok); background:var(--ok-weak);}

  /* 密钥面板 */
  .key-panel{
    position:absolute; top:calc(100% + 8px); right:0; width:320px; max-width:calc(100vw - 28px);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:0 12px 32px rgba(16,24,40,.16); padding:14px; z-index:40;
    animation:fadeIn .18s ease both;
  }
  .key-panel h4{font-size:14px; font-weight:700; margin-bottom:4px;}
  .key-panel .desc{font-size:12px; color:var(--text-3); line-height:1.65; margin-bottom:10px;}
  .key-panel input{
    width:100%; padding:10px 12px; border:1px solid var(--border-strong); border-radius:9px;
    font-size:16px; outline:none; background:var(--surface-2); transition:border-color .15s, background .15s;
  }
  .key-panel input:focus{border-color:var(--primary); background:var(--surface);}
  .key-row{display:flex; gap:8px; margin-top:10px;}
  .key-btn-act{
    flex:1; height:40px; border-radius:9px; background:var(--primary); color:#fff;
    font-size:13.5px; font-weight:700; transition:background .15s;
  }
  .key-btn-act:hover{background:var(--primary-strong);}
  .key-btn-ghost{
    height:40px; padding:0 14px; border-radius:9px; border:1px solid var(--border); color:var(--text-2); font-size:13px;
  }
  .key-btn-ghost:hover{background:var(--surface-2);}
  .key-status{font-size:12px; color:var(--text-3); margin-top:10px; display:flex; align-items:center; gap:6px; line-height:1.5;}
  .key-status.on{color:var(--ok);}

  /* ===== 消息流 ===== */
  main{flex:1; width:100%; max-width:760px; margin:0 auto; padding:16px 14px 24px; display:flex; flex-direction:column; gap:12px;}
  .feed{display:flex; flex-direction:column; gap:12px;}
  .post-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:12px 14px; animation:fadeIn .28s ease both;
  }
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .post-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .avatar{
    width:36px; height:36px; border-radius:50%; color:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700;
  }
  .post-meta{min-width:0; flex:1; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .nickname{font-size:14px; font-weight:700;}
  .post-time{font-size:12px; color:var(--text-3);}
  .floor{
    font-size:11px; font-weight:700; color:var(--primary); background:var(--primary-weak);
    padding:2px 8px; border-radius:999px; flex:none;
  }
  .post-content{font-size:14.5px; line-height:1.75; word-break:break-word; white-space:pre-wrap; overflow-wrap:anywhere;}
  .decrypting{color:var(--text-3); font-size:12.5px; display:flex; align-items:center; gap:7px; padding:4px 0;}
  .decrypting .spinner{width:13px; height:13px; border-width:2px;}

  /* 附件展示 */
  .post-files{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .file-img{border-radius:var(--radius-s); max-width:100%; max-height:340px; width:auto; display:block; object-fit:cover; border:1px solid var(--border); cursor:zoom-in;}
  .file-media video{width:100%; max-height:380px; border-radius:var(--radius-s); background:#0B0E14;}
  .file-media audio{width:100%;}
  .file-card{
    display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--border);
    border-radius:var(--radius-s); background:var(--surface-2); text-decoration:none; color:var(--text);
    transition:border-color .15s, background .15s; max-width:100%;
  }
  .file-card:hover{border-color:var(--border-strong); background:#F0F2F5;}
  .file-ic{
    width:38px; height:38px; border-radius:9px; background:var(--primary-weak); color:var(--primary); flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .file-ic svg{width:19px; height:19px;}
  .file-ic.type-accent{background:var(--accent-weak); color:#C77C08;}
  .file-info{min-width:0; flex:1;}
  .file-name{font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .file-sub{font-size:11.5px; color:var(--text-3); margin-top:1px;}
  .file-go{color:var(--text-3); flex:none;}
  .file-go svg{width:15px; height:15px;}
  .file-note{
    font-size:12px; color:var(--text-3); background:var(--surface-2); border:1px dashed var(--border-strong);
    border-radius:var(--radius-s); padding:10px 12px; display:flex; align-items:center; gap:8px;
  }
  .file-note svg{width:15px; height:15px; flex:none; color:var(--text-3);}
  .file-note .retry-btn{
    margin-left:auto; flex:none; border:1px solid var(--border-strong); border-radius:6px;
    padding:3px 10px; font-size:12px; color:var(--primary); background:var(--surface); transition:background .15s;
  }
  .file-note .retry-btn:hover{background:var(--surface-2);}

  /* 空态 / 加载态 */
  .empty{
    text-align:center; padding:64px 20px; color:var(--text-2);
  }
  .empty svg{width:64px; height:64px; color:#C9CFD8; margin-bottom:14px;}
  .empty .t{font-size:15px; font-weight:700; color:var(--text); margin-bottom:6px;}
  .empty .s{font-size:13px; color:var(--text-3);}
  .loading{display:flex; justify-content:center; padding:40px 0; color:var(--text-3); font-size:13px;}
  .spinner{width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== 底部输入区 ===== */
  .composer-wrap{
    position:sticky; bottom:0; z-index:20; background:var(--surface);
    border-top:1px solid var(--border); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .composer-inner{max-width:760px; margin:0 auto;}
  .attach-preview{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none;}
  .attach-preview::-webkit-scrollbar{display:none;}
  .att-item{
    display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius-s); padding:5px 8px; font-size:12px; flex:none; max-width:200px;
  }
  .att-item .att-ic{width:22px; height:22px; border-radius:6px; background:var(--primary-weak); color:var(--primary); display:flex; align-items:center; justify-content:center; flex:none;}
  .att-item .att-ic svg{width:12px; height:12px;}
  .att-item .att-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:110px;}
  .att-item .att-size{color:var(--text-3); flex:none;}
  .att-item .att-rm{color:var(--text-3); flex:none; padding:2px;}
  .att-item .att-rm:hover{color:var(--danger);}
  .att-item .att-rm svg{width:13px; height:13px; display:block;}
  .composer-row{display:flex; align-items:flex-end; gap:8px;}
  .msg-input{
    flex:1; resize:none; border:1px solid var(--border-strong); border-radius:12px; background:var(--surface-2);
    padding:10px 13px; font-size:15px; line-height:1.5; min-height:42px; max-height:130px; outline:none;
    transition:border-color .15s, background .15s;
  }
  .msg-input:focus{border-color:var(--primary); background:var(--surface);}
  .msg-input::placeholder{color:var(--text-3);}
  .send-btn{
    height:42px; padding:0 20px; border-radius:12px; background:var(--primary); color:#fff;
    font-size:14.5px; font-weight:700; flex:none; transition:background .15s, opacity .15s;
  }
  .send-btn:hover{background:var(--primary-strong);}
  .send-btn:disabled{opacity:.55; cursor:not-allowed;}
  .composer-meta{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .nick-input{
    width:150px; border:1px solid transparent; border-radius:8px; background:transparent;
    padding:5px 8px; font-size:13px; color:var(--text-2); outline:none; transition:background .15s, border-color .15s;
  }
  .nick-input:hover{background:var(--surface-2);}
  .nick-input:focus{background:var(--surface-2); border-color:var(--border);}
  .composer-hint{font-size:12px; color:var(--text-3); margin-left:auto;}
  .att-sum{font-size:12px; color:var(--primary); font-weight:700; flex:none;}
  .enc-hint{font-size:12px; color:var(--ok); display:flex; align-items:center; gap:4px; font-weight:500;}
  .enc-hint svg{width:12px; height:12px;}

  /* Toast */
  .toast{
    position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:#23272E; color:#fff; font-size:13px; padding:9px 16px; border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:50; max-width:88vw;
    animation:toastIn .22s ease both;
  }
  .toast.err{background:var(--danger);}
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

  /* 响应式 */
  @media (max-width:560px){
    main{padding:12px 10px 20px;}
    .post-card{padding:11px 12px;}
    .composer-hint{display:none;}
    .nick-input{width:120px; font-size:16px;}
    .msg-input{font-size:16px;}
    .send-btn{padding:0 16px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
  /* 深色模式适配 */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111418; --surface:#1A1F26; --surface-2:#212833;
      --border:#2A303A; --border-strong:#39404C;
      --text:#E7EAEE; --text-2:#A8B0BC; --text-3:#7C8594;
      --primary:#4C8DFF; --primary-strong:#6FA3FF; --primary-weak:#1E2A44;
      --accent:#F5B23E; --accent-weak:#3A2F1A;
      --danger:#F87171; --danger-weak:#3A1F22;
      --ok:#34D399; --ok-weak:#16302A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.35);
    }
    .file-card:hover{background:#252C36;}
    .file-media video{background:#0B0E14;}
    .toast{background:#2A303A;}
  }
  [hidden]{display:none !important;}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </span>
    小鸟贴吧
    <span class="tag">社区留言板</span>
  </div>
  <div class="top-actions">
    <span id="connState" class="conn-state"><span class="dot"></span><span id="connText">连接中…</span></span>
    <button id="keyBtn" class="icon-btn" title="设置房间密钥（端到端加密）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </button>
    <button id="refreshBtn" class="icon-btn" title="刷新消息">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
    <div id="keyPanel" class="key-panel" hidden>
      <h4>房间密钥</h4>
      <div class="desc">消息与附件会用此密钥加密后存储，知道同一密钥的人才能看到内容。密钥不会上传，忘记将无法解密。</div>
      <input id="keyInput" type="password" placeholder="输入房间密钥（至少 6 位）" autocomplete="off">
      <div class="key-row">
        <button id="keyApply" class="key-btn-act">设置密钥</button>
        <button id="keyClear" class="key-btn-ghost">清除</button>
      </div>
      <div id="keyStatus" class="key-status"></div>
    </div>
  </div>
</header>

<main>
  <div id="feed" class="feed"></div>
  <div id="emptyState" class="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="10" x2="15" y2="10"/></svg>
    <div class="t">还没有人发言</div>
    <div class="s">在下方输入内容，发第一条帖子吧</div>
  </div>
  <div id="loading" class="loading"><div class="spinner"></div></div>
</main>

<footer class="composer-wrap">
  <div class="composer-inner">
    <div id="attachPreview" class="attach-preview" hidden></div>
    <div class="composer-row">
      <input id="fileInput" type="file" multiple hidden>
      <button id="fileBtn" class="icon-btn" title="添加附件（图片/视频/音频/文档，单个≤500MB）" style="width:42px;height:42px;border-radius:12px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea id="msgInput" class="msg-input" rows="1" maxlength="2000" placeholder="说点什么…（Enter 发送）"></textarea>
      <button id="sendBtn" class="send-btn">发送</button>
    </div>
    <div class="composer-meta">
      <input id="nickInput" class="nick-input" maxlength="20" placeholder="你的昵称">
      <span id="attSummary" class="att-sum" hidden></span>
      <span id="encHint" class="enc-hint" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        已加密
      </span>
      <span class="composer-hint">Enter 发送 · Shift+Enter 换行</span>
    </div>
  </div>
</footer>

<div id="toast" class="toast" hidden></div>

<script>
/* ===== 配置（来自你的 Supabase 项目） ===== */
const SUPABASE_URL = 'https://gbemkxwizbceqmsrerix.supabase.co';
const TABLE_PATH   = '/rest/v1/wiebxhwvx';
const BUCKET       = 'tysthjv';
const ANON_KEY     = 'sb_publishable_5mocRK-Zci-bnVLQ92YCRA_m4cM_iiV';
const MAX_FILES      = 20;
const MAX_FILE_SIZE  = 500 * 1024 * 1024;  // 单文件上限 500MB
const MAX_TOTAL_SIZE = 1024 * 1024 * 1024; // 待发送附件累积上限 1GB
const POLL_MS       = 20000;

const AUTH_HEADERS = {
  'apikey': ANON_KEY,
  'Authorization': 'Bearer ' + ANON_KEY,
  'Content-Type': 'application/json'
};

/* ===== 状态 ===== */
let messages = [];        // 正序（最新在底部）
let pendingFiles = [];    // 待发送附件 {file}
let busy = false;

/* ===== DOM ===== */
const $ = id => document.getElementById(id);
const feedEl = $('feed'), emptyEl = $('emptyState'), loadingEl = $('loading');
const connEl = $('connState'), connText = $('connText');
const fileInput = $('fileInput'), fileBtn = $('fileBtn'), msgInput = $('msgInput'), sendBtn = $('sendBtn');
const nickInput = $('nickInput'), attachPreview = $('attachPreview'), toastEl = $('toast'), attSummary = $('attSummary');
const keyBtn = $('keyBtn'), keyPanel = $('keyPanel'), keyInput = $('keyInput');
const keyApply = $('keyApply'), keyClear = $('keyClear'), keyStatus = $('keyStatus'), encHint = $('encHint');

/* ===== 昵称 ===== */
const LS_NICK = 'tieba_nick_v1';
/* localStorage 安全封装：隐私模式/被禁用时静默降级，避免初始化中断导致页面卡在加载 */
const safeStore = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
  remove(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function loadNick(){
  let n = safeStore.get(LS_NICK);
  if(!n){ n = '吧友' + Math.floor(1000 + Math.random() * 9000); safeStore.set(LS_NICK, n); }
  nickInput.value = n;
  return n;
}
function saveNick(){ safeStore.set(LS_NICK, nickInput.value.trim() || '匿名'); }

/* ===== 工具 ===== */
function fmtSize(b){
  if(b < 1024) return b + ' B';
  if(b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  if(b < 1024*1024*1024) return (b/1024/1024).toFixed(1) + ' MB';
  return (b/1024/1024/1024).toFixed(2) + ' GB';
}
function fmtTime(iso){
  const t = new Date(iso); if(isNaN(t)) return '';
  const diff = (Date.now() - t.getTime()) / 1000;
  if(diff < 60) return '刚刚';
  if(diff < 3600) return Math.floor(diff/60) + ' 分钟前';
  if(diff < 86400) return Math.floor(diff/3600) + ' 小时前';
  if(diff < 86400*2) return '昨天 ' + pad(t.getHours()) + ':' + pad(t.getMinutes());
  if(t.getFullYear() === new Date().getFullYear()) return (t.getMonth()+1) + '月' + t.getDate() + '日 ' + pad(t.getHours()) + ':' + pad(t.getMinutes());
  return t.getFullYear() + '年' + (t.getMonth()+1) + '月' + t.getDate() + '日';
}
function pad(n){ return n < 10 ? '0'+n : ''+n; }

/* ===== 端到端加密（AES-GCM 256 + PBKDF2） ===== */
const LS_KEY = 'tieba_key_v1';
const KEY_SALT = new TextEncoder().encode('xiao-niao-tieba::v1');
const ENC_PREFIX = 'enc:';
let currentKey = null;
/* Web Crypto 需要安全上下文（https / localhost）。file:// 在部分移动浏览器不可用，提前检测并提示 */
const CRYPTO_OK = !!(window.crypto && window.crypto.subtle);

function b64FromBytes(buf){
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let bin = '';
  for(let i = 0; i < bytes.length; i += 0x8000){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}
function bytesFromB64(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function deriveKeyFromPassword(password){
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: KEY_SALT, iterations: 150000, hash:'SHA-256' },
    material,
    { name:'AES-GCM', length:256 },
    true,
    ['encrypt','decrypt']
  );
}
async function setPassword(password){
  if(!CRYPTO_OK) throw new Error('当前环境不支持加密，请通过 https 打开页面');
  currentKey = await deriveKeyFromPassword(password);
  const raw = await crypto.subtle.exportKey('raw', currentKey);
  safeStore.set(LS_KEY, b64FromBytes(raw));
  clearBadKeys();
  invalidateCaches();
  updateKeyUI();
  refresh(false);
  return true;
}
async function loadSavedKey(){
  if(!CRYPTO_OK) return false;
  const b64 = safeStore.get(LS_KEY);
  if(!b64) return false;
  try{
    currentKey = await crypto.subtle.importKey('raw', bytesFromB64(b64), {name:'AES-GCM'}, true, ['encrypt','decrypt']);
    invalidateCaches();
    updateKeyUI();
    return true;
  }catch(e){ safeStore.remove(LS_KEY); return false; }
}
function clearKey(){
  currentKey = null;
  safeStore.remove(LS_KEY);
  invalidateCaches();
  updateKeyUI();
  refresh(false);
}
function updateKeyUI(){
  keyBtn.classList.toggle('key-on', !!currentKey);
  keyBtn.title = currentKey ? '已加密（点击更换房间密钥）' : '设置房间密钥（端到端加密）';
  keyStatus.textContent = currentKey ? '已加密：所有消息与附件均加密存储' : '未设置密钥：只能查看历史明文消息';
  keyStatus.classList.toggle('on', !!currentKey);
  encHint.hidden = !currentKey;
}

/* 文本加解密：enc:base64(iv):base64(密文) */
async function encryptText(plain){
  if(!plain) return '';
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, currentKey, new TextEncoder().encode(plain));
  return ENC_PREFIX + b64FromBytes(iv) + ':' + b64FromBytes(ct);
}
async function decryptText(payload){
  if(!payload) return { ok:true, text:'' };
  if(typeof payload !== 'string' || !payload.startsWith(ENC_PREFIX)) return { ok:true, text: payload };
  if(!currentKey) return { ok:false, needKey:true, text:'' };
  try{
    const body = payload.slice(ENC_PREFIX.length);
    const sep = body.indexOf(':');
    if(sep < 0) return { ok:true, text: payload };
    const iv = bytesFromB64(body.slice(0, sep));
    const ct = bytesFromB64(body.slice(sep + 1));
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, currentKey, ct);
    return { ok:true, text: new TextDecoder().decode(pt) };
  }catch(e){
    return { ok:false, needKey:false, text:'' };
  }
}

/* 附件加解密：文件整体加密后上传（密文文件），读取时下载解密 */
async function encryptFile(file){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await file.arrayBuffer();
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, currentKey, data);
  const out = new Uint8Array(iv.length + ct.byteLength);
  out.set(iv, 0);
  out.set(new Uint8Array(ct), iv.length);
  const base = (file.name || 'file').replace(/\.[^.]+$/, '') || 'file';
  return { blob: new Blob([out], { type:'application/octet-stream' }), name: base + '.enc' };
}
/* 附件下载+解密：流式下载实时显示进度；网络错误自动重试 2 次（单次 120 秒超时）；密钥不匹配立即判定 */
async function fetchWithProgress(url, onProgress){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  let res;
  try{
    res = await fetch(url, { signal: ctrl.signal });
  }catch(e){
    clearTimeout(timer);
    if(e && e.name === 'AbortError') throw new Error('附件下载超时（超过 120 秒）');
    throw e;
  }
  clearTimeout(timer);
  if(!res.ok) throw new Error('附件下载失败（' + res.status + '）');
  const total = Number(res.headers.get('content-length')) || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    chunks.push(value);
    got += value.length;
    if(onProgress) onProgress(total, got);
  }
  const buf = new Uint8Array(got);
  let off = 0;
  for(const c of chunks){ buf.set(c, off); off += c.length; }
  return buf;
}
async function decryptFileBlob(url, onProgress){
  let lastErr = null;
  for(let attempt = 0; attempt < 2; attempt++){
    if(attempt > 0) await new Promise(r => setTimeout(r, 1500));
    try{
      const buf = await fetchWithProgress(url, onProgress);
      const iv = buf.subarray(0, 12);
      const ct = buf.subarray(12);
      return await crypto.subtle.decrypt({ name:'AES-GCM', iv }, currentKey, ct);
    }catch(e){
      lastErr = e;
      if(e && e.name === 'OperationError'){
        throw Object.assign(new Error('密钥不正确'), { auth: true });
      }
      /* 网络/传输/超时错误：继续重试 */
    }
  }
  throw lastErr;
}
/* ===== 解密结果缓存 =====
 * 关键：缓存"解密任务"（Promise）而非仅结果，
 * 轮询刷新复用同一任务，大文件不再被刷新打断、重复下载 */
const textCache = new Map();    // id -> {nick, content, contentState}
const attachCache = new Map();  // id -> {promise, files, prog}
let cacheOrder = [];
function revokeAttach(id){
  const entry = attachCache.get(id);
  if(entry && entry.files) entry.files.forEach(f => f.blobUrl && URL.revokeObjectURL(f.blobUrl));
}
function trimCache(){
  while(attachCache.size > 40 && cacheOrder.length){
    const id = cacheOrder.shift();
    if(attachCache.has(id)){
      revokeAttach(id);
      attachCache.delete(id);
      textCache.delete(id);
    }
  }
}
function invalidateCaches(){
  attachCache.forEach((entry, id) => revokeAttach(id));
  attachCache.clear();
  textCache.clear();
  cacheOrder = [];
}

/* 密钥不匹配黑名单：密钥对不上的消息持久化记录，之后不再下载解密（换密钥时清空） */
const LS_BADKEY = 'tieba_badkey_v1';

}

/* 多附件渲染：file_url 可能是 JSON 数组（新）或单个 URL（旧数据），逐个渲染 */
function parseAttachList(raw){
  if(typeof raw !== 'string' || !raw) return [];
  let urls = [];
  if(raw.trim().startsWith('[')){
    try{ urls = JSON.parse(raw); }catch(e){ urls = []; }
  } else {
    urls = [raw];
  }
  return urls.filter(u => typeof u === 'string' && /^https?:\/\//i.test(u));
}
function parseAttachMeta(raw){
  if(typeof raw !== 'string' || !raw) return [];
  let arr = [];
  if(raw.trim().startsWith('[')){
    try{ arr = JSON.parse(raw); }catch(e){ arr = []; }
  } else {
    arr = [raw];
  }
  return arr;
}
/* 单附件处理：返回渲染描述对象，由 renderAttachment 统一渲染并缓存（避免轮询时重复下载解密） */
async function renderOneFile(id, url, name, type, prog){
  const kind = type ? fileKind(type, name) : 'file';
  const lastSeg = decodeURIComponent(url.split('/').pop() || '');
  const isEnc = /\.enc($|\?)/i.test(lastSeg);
  if(!isEnc){
    return { url, name, kind, type, ok: true };
  }
  if(!currentKey){
    return { url, name, kind, type, ok: false, needKey: true };
  }
  /* 黑名单命中：密钥对不上，直接跳过，不下载不解密 */
  if(badKeyIds.has(id)){
    return { url, name, kind, type, ok: false, needKey: false, badKey: true };
  }
  try{
    if(prog){ prog.phase = 'download'; prog.pct = 0; prog.sizeText = ''; paintProgress(prog); }
    const pt = await decryptFileBlob(url, (total, got) => {
      if(!prog) return;
      prog.pct = total ? Math.round(got / total * 100) : 0;
      prog.sizeText = (total ? fmtSize(got) + ' / ' + fmtSize(total) : fmtSize(got));
      paintProgress(prog);
    });
    if(prog){ prog.phase = 'decrypt'; paintProgress(prog); }
    const blob = new Blob([pt], { type: type || 'application/octet-stream' });
    const blobUrl = URL.createObjectURL(blob);
    return { url: blobUrl, name, kind, type, size: blob.size, dl: name, blobUrl, ok: true };
  }catch(e){
    if(e && e.auth){
      badKeyIds.add(id);
      saveBadKeys();
      return { url, name, kind, type, ok: false, needKey: false };
    }
    /* 网络/下载失败：可重试 */
    return { url, name, kind, type, ok: false, needKey: false, netErr: true };
  }
}
/* 进度显示：实时更新；页面刷新重建后自动改指向新元素 */
function paintProgress(prog){
  if(!prog || !prog.el || !prog.el.isConnected) return;
  if(prog.phase === 'download'){
    prog.el.textContent = prog.pct > 0
      ? '正在下载附件 ' + prog.i + '/' + prog.n + '（' + prog.pct + '% ' + prog.sizeText + '）'
      : '正在下载附件 ' + prog.i + '/' + prog.n + '…';
  } else {
    prog.el.textContent = '正在解密附件 ' + prog.i + '/' + prog.n + '…';
  }
}
/* 把解密结果渲染进容器（含失败/重试分支） */
function renderFilesInto(container, files, rowId){
  container.innerHTML = '';
  files.forEach(f => {
    if(!f.ok){
      const note = noteEl(
        f.badKey ? '附件密钥不匹配，已跳过（可点密钥按钮换密钥后查看）'
        : f.needKey ? '加密附件：设置房间密钥后可查看'
        : f.netErr ? '附件下载失败，请检查网络后重试'
        : '附件无法解密（房间密钥不正确）'
      );
      if(f.netErr){
        const btn = document.createElement('button');
        btn.className = 'retry-btn'; btn.textContent = '重试';
        btn.addEventListener('click', () => {
          const entry = attachCache.get(rowId);
          if(entry){ entry.files = null; entry.promise = null; }
          const row = messages.find(m => m.id === rowId);
          if(row) renderAttachment(container, row);
        });
        note.appendChild(btn);
      }
      container.appendChild(note);
      return;
    }
    renderDirectFile(container, f);
  });
}
/* 多附件渲染：缓存"解密任务"本身（Promise），
 * 轮询刷新复用同一任务，绝不重复下载；解密完成立即上屏 */
async function renderAttachment(container, row){
  const urls = parseAttachList(row.file_url);
  if(urls.length === 0){ container.innerHTML = ''; return; }
  let entry = attachCache.get(row.id);
  if(!entry){
    const prog = { phase:'download', pct:0, i:1, n:urls.length, sizeText:'', el:null };
    const promise = (async () => {
      const nameRes = await decryptText(row.file_name);
      const nameText = nameRes.ok ? (nameRes.text || '') : '';
      const names = nameText ? parseAttachMeta(nameText) : [];
      const types = parseAttachMeta(row.file_type);
      const files = [];
      /* 串行下载解密，避免多个大文件并发争抢带宽 */
      for(let i = 0; i < urls.length; i++){
        prog.i = i + 1; prog.n = urls.length;
        const name = (names && names[i]) || ('附件' + (i + 1));
        const type = (types && types[i]) || 'application/octet-stream';
        files.push(await renderOneFile(row.id, urls[i], name, type, prog));
      }
      return files;
    })();
    entry = { promise, files: null, prog };
    attachCache.set(row.id, entry);
    cacheOrder.push(row.id);
    trimCache();
    promise.then(files => {
      entry.files = files;
      /* 解密完成：若该卡片还在页面中，立即渲染，不等下一轮刷新 */
      const box = document.querySelector('.post-files[data-id="' + row.id + '"]');
      if(box) renderFilesInto(box, files, row.id);
    }).catch(() => {});
  }
  if(entry.files){
    renderFilesInto(container, entry.files, row.id);
    return;
  }
  /* 解密进行中：显示实时进度占位（复用同一任务） */
  container.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'decrypting';
  d.innerHTML = '<span class="spinner"></span><span class="d-text"></span>';
  container.appendChild(d);
  entry.prog.el = d.querySelector('.d-text');
  paintProgress(entry.prog);
}
const attachIO = ('IntersectionObserver' in window)
  ? new IntersectionObserver(entries => {
      entries.forEach(en => {
        if(en.isIntersecting){
          const el = en.target;
          attachIO.unobserve(el);
          const row = messages[Number(el.dataset.idx)];
          if(row) renderAttachment(el, row);
        }
      });
    }, { rootMargin: '240px' })
  : null;

/* 消息卡片：先骨架，再异步解密填充（解密结果缓存，刷新不重复解密） */
async function fillCard(card, row){
  let nickText, contentText = '', contentState = 'none';
  const cached = textCache.get(row.id);
  if(cached){
    nickText = cached.nick;
    contentText = cached.content;
    contentState = cached.contentState;
  } else {
    const nickRes = await decryptText(row.nickname);
    nickText = nickRes.ok ? (nickRes.text || '匿名') : (nickRes.needKey ? '需密钥' : '无法解密');
    if(row.content){
      const cRes = await decryptText(row.content);
      contentText = cRes.ok ? cRes.text : '';
      contentState = cRes.ok ? 'ok' : (cRes.needKey ? 'needKey' : 'fail');
    }

  const nickEl = card.querySelector('.nickname'); if(nickEl) nickEl.textContent = nickText;

  const bodyEl = card.querySelector('.post-content');
  if(bodyEl){
    bodyEl.innerHTML = '';
    if(contentState === 'ok'){
      if(contentText) bodyEl.textContent = contentText;
    } else if(contentState === 'needKey'){
      bodyEl.appendChild(noteEl('加密消息：输入房间密钥后查看'));
    } else if(contentState === 'fail'){
      bodyEl.appendChild(noteEl('无法解密（房间密钥不正确）'));
    }
  }
}
function renderFeed(scrollBottom){
  feedEl.innerHTML = '';
  if(messages.length === 0){
    emptyEl.hidden = false; loadingEl.hidden = true; return;
  }
  emptyEl.hidden = true; loadingEl.hidden = true;
  messages.forEach((row, i) => {
    const card = document.createElement('article'); card.className = 'post-card';
    const head = document.createElement('div'); head.className = 'post-head';
    const av = document.createElement('span'); av.className = 'avatar'; av.style.background = '#C9CFD8'; av.textContent = '?';
    const meta = document.createElement('div'); meta.className = 'post-meta';
    const nick = document.createElement('span'); nick.className = 'nickname'; nick.textContent = '解密中…';
    const time = document.createElement('span'); time.className = 'post-time'; time.textContent = fmtTime(row.created_at);
    meta.appendChild(nick); meta.appendChild(time);
    const floor = document.createElement('span'); floor.className = 'floor'; floor.textContent = '#' + (i + 1);
    head.appendChild(av); head.appendChild(meta); head.appendChild(floor);
    card.appendChild(head);
    if(row.content){
      const body = document.createElement('div'); body.className = 'post-content';
      const d = document.createElement('span'); d.className = 'decrypting'; d.innerHTML = '<span class="spinner"></span>解密中…';
      body.appendChild(d); card.appendChild(body);
    }
    if(row.file_url){
      const files = document.createElement('div'); files.className = 'post-files';
      files.dataset.idx = i;
      files.dataset.id = row.id;
      const d = document.createElement('div'); d.className = 'decrypting'; d.innerHTML = '<span class="spinner"></span>解密附件…';
      files.appendChild(d);
      card.appendChild(files);
      if(attachIO) attachIO.observe(files); else renderAttachment(files, row);
    }
    feedEl.appendChild(card);
    fillCard(card, row);
  });
  if(scrollBottom) window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

/* ===== Toast ===== */
let toastTimer = null;
function toast(msg, isErr){
  toastEl.textContent = msg;
  toastEl.className = 'toast' + (isErr ? ' err' : '');
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3200);
}

/* ===== 附件管理 ===== */
function pendingTotalSize(){
  return pendingFiles.reduce((s, it) => s + (it.file.size || 0), 0);
}
function isDuplicate(file){
  return pendingFiles.some(it => it.file.name === file.name && it.file.size === file.size);
}
function updateAttachSummary(){
  if(pendingFiles.length === 0){ attSummary.hidden = true; return; }
  attSummary.hidden = false;
  attSummary.textContent = pendingFiles.length + ' 个附件 · ' + fmtSize(pendingTotalSize());
}
function updateAttachPreview(){
  attachPreview.innerHTML = '';
  if(pendingFiles.length === 0){ attachPreview.hidden = true; updateAttachSummary(); return; }
  attachPreview.hidden = false;
  pendingFiles.forEach((item, idx) => {
    const el = document.createElement('div'); el.className = 'att-item';
    const ic = document.createElement('span'); ic.className = 'att-ic';
    ic.innerHTML = fileIconSvg(extIcon(item.file.name));
    const nm = document.createElement('span'); nm.className = 'att-name'; nm.textContent = item.file.name;
    const sz = document.createElement('span'); sz.className = 'att-size'; sz.textContent = fmtSize(item.file.size);
    const rm = document.createElement('button'); rm.className = 'att-rm'; rm.title = '移除';
    rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    rm.addEventListener('click', () => { pendingFiles.splice(idx, 1); updateAttachPreview(); });
    el.appendChild(ic); el.appendChild(nm); el.appendChild(sz); el.appendChild(rm);
    attachPreview.appendChild(el);
  });
  updateAttachSummary();
}
function addFiles(fileList){
  const arr = Array.from(fileList);
  for(const f of arr){
    if(f.size > MAX_FILE_SIZE){
      toast('「' + f.name + '」超过 500MB 单文件限制，未添加', true); continue;
    }
    if(isDuplicate(f)){
      toast('「' + f.name + '」已在列表中，不重复添加', true); continue;
    }
    if(pendingFiles.length >= MAX_FILES){
      toast('最多同时发送 ' + MAX_FILES + ' 个文件', true); break;
    }
    if(pendingTotalSize() + f.size > MAX_TOTAL_SIZE){
      toast('附件累积将超过 1GB，「' + f.name + '」未添加', true); continue;
    }
    pendingFiles.push({ file: f });
  }
  updateAttachPreview();
}

/* ===== 上传 & 发送（全程加密） ===== */
async function uploadFile(blob, name){
  const safeName = name.replace(/[\\\/:*?"<>|]/g, '_').slice(0, 80);
  const path = 'uploads/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '-' + encodeURIComponent(safeName);
  const url = SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path;
  let res;
  try{ res = await fetch(url, {
    method: 'POST',
    headers: {
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + ANON_KEY,
      'Content-Type': 'application/octet-stream',
      'x-upsert': 'true',
      'cache-control': 'public, max-age=31536000'
    },
    body: blob
  }); }
  catch(e){ throw new Error('文件上传失败：网络错误'); }
  if(!res.ok){
    let msg = '文件上传失败（' + res.status + '）';
    try{ const j = await res.json(); if(j.message) msg = '文件上传失败：' + j.message; }catch(e){}
    throw new Error(msg);
  }
  return SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path;
}

async function sendMessage(){
  if(busy) return;
  const content = msgInput.value.trim();
  if(!content && pendingFiles.length === 0){
    toast('写点内容或添加一个附件'); return;
  }
  if(!CRYPTO_OK){
    toast('当前环境不支持加密，请通过 https 打开页面', true);
    return;
  }
  if(!currentKey){
    toast('请先设置房间密钥再发送');
    keyPanel.hidden = false;
    keyInput.focus();
    return;
  }
  busy = true;
  sendBtn.disabled = true;
  sendBtn.textContent = '加密发送中…';
  try{
    const uploaded = [];
    for(const item of pendingFiles){
      try{
        const ef = await encryptFile(item.file);
        const url = await uploadFile(ef.blob, ef.name);
        uploaded.push({ url, name: item.file.name, type: item.file.type || 'application/octet-stream' });
      }catch(e){
        toast(e.message, true);
        throw e;
      }
    }
    const row = {
      nickname: await encryptText((nickInput.value.trim() || '匿名').slice(0, 20)),
      content: await encryptText(content),
      /* 多附件：打包成 JSON 数组存进单值字段（兼容旧版单附件数据） */
      file_url: uploaded.length ? JSON.stringify(uploaded.map(u => u.url)) : null,
      file_name: uploaded.length ? await encryptText(JSON.stringify(uploaded.map(u => u.name))) : null,
      file_type: uploaded.length ? JSON.stringify(uploaded.map(u => u.type)) : null
    };
    const created = await apiFetch(SUPABASE_URL + TABLE_PATH, {
      method: 'POST',
      headers: Object.assign({ 'Prefer': 'return=representation' }, AUTH_HEADERS),
      body: JSON.stringify(row)
    });
    if(Array.isArray(created) && created.length){
      messages.push(created[0]);
      renderFeed(true);
    } else {
      await refresh(false);
    }
    msgInput.value = ''; autoGrow();
    pendingFiles = []; updateAttachPreview();
    saveNick();
  } catch(e){
    toast(e.message, true);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    sendBtn.textContent = '发送';
  }
}

/* ===== 刷新 & 轮询 ===== */
let connRetryTimer = null;
async function refresh(manual){
  try{
    const rows = await loadMessages();
    const had = messages.length;
    messages = rows;
    renderFeed(manual && had === 0);
    setConn(true);
  }catch(e){
    setConn(false, e.message);
    if(manual) toast(e.message, true);
    /* 连接失败后 8 秒自动重试，网络恢复后自动连上，无需手动刷新 */
    clearTimeout(connRetryTimer);
    connRetryTimer = setTimeout(() => { if(!busy) refresh(false); }, 8000);
  }
}
function setConn(ok, msg){
  connEl.classList.toggle('on', ok);
  connEl.classList.toggle('off', !ok);
  connText.textContent = ok ? '已连接' : (msg || '连接失败');
  connText.title = ok ? '' : (msg || '');
}
function autoGrow(){
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 130) + 'px';
}

/* ===== 事件 ===== */
fileBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
msgInput.addEventListener('input', autoGrow);
msgInput.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault(); sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);
$('refreshBtn').addEventListener('click', () => {
  const b = $('refreshBtn'); b.style.opacity = .5;
  refresh(true).finally(() => { b.style.opacity = 1; });
});
nickInput.addEventListener('change', saveNick);
nickInput.addEventListener('blur', () => { if(!nickInput.value.trim()) nickInput.value = '匿名'; });

/* 密钥面板 */
keyBtn.addEventListener('click', e => {
  e.stopPropagation();
  keyPanel.hidden = !keyPanel.hidden;
  if(!keyPanel.hidden) keyInput.focus();
});
document.addEventListener('click', e => {
  if(!keyPanel.hidden && !keyPanel.contains(e.target) && e.target !== keyBtn) keyPanel.hidden = true;
});
keyInput.addEventListener('keydown', e => { if(e.key === 'Enter') keyApply.click(); });
keyApply.addEventListener('click', async () => {
  const pwd = keyInput.value;
  if(pwd.length < 6){ toast('房间密钥至少 6 位', true); return; }
  try{
    await setPassword(pwd);
    keyInput.value = '';
    keyPanel.hidden = true;
    toast('已开启端到端加密');
  }catch(e){
    toast('加密初始化失败：' + (e && e.message || '未知错误'), true);
  }
});
keyClear.addEventListener('click', () => {
  clearKey();
  keyPanel.hidden = true;
  toast('已清除密钥，仅可查看历史明文消息');
});

/* 拖拽上传（可选增强） */
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

/* ===== 初始化 ===== */
/* 初始化：try-catch 保护，任何单点错误都不影响页面交互（密钥按钮始终可点） */
try{
  loadNick();
  loadBadKeys();
  renderFeed(false);
}catch(e){
  console.error('初始化错误:', e);
}
if(!CRYPTO_OK){
  toast('当前环境不支持加密，请通过 https 打开页面', true);
  refresh(false);
}else{
  loadSavedKey()
    .then(() => refresh(false))
    .catch(e => console.error('密钥加载失败:', e));
}
setInterval(() => { if(document.visibilityState === 'visible' && !busy) refresh(false); }, POLL_MS);
</script>
